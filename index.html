<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stark Hall of Armor // Laboratory</title>
  <style>
    body {
      margin: 0;
      background-color: #020408;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      color: #00f0ff;
    }
    #init-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      background: rgba(6, 11, 20, 0.96);
      border: 1px solid rgba(0, 240, 255, 0.4);
      padding: 32px 42px;
      border-radius: 12px;
      box-shadow: 0 0 40px rgba(0, 240, 255, 0.25);
      max-width: 520px;
      z-index: 999;
    }
    #init-overlay h1 {
      margin: 0 0 10px;
      font-size: 1.5rem;
      letter-spacing: 3px;
      color: #00f0ff;
    }
    #init-overlay p {
      font-size: 0.9rem;
      color: #8be4fc;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .action-btn {
      background: linear-gradient(135deg, #00d2ff 0%, #0066ff 100%);
      color: #fff;
      border: none;
      padding: 13px 32px;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 2px;
      border-radius: 6px;
      cursor: pointer;
      box-shadow: 0 0 18px rgba(0, 210, 255, 0.5);
      transition: all 0.2s ease;
    }
    .action-btn:hover {
      transform: scale(1.03);
      box-shadow: 0 0 28px rgba(0, 210, 255, 0.8);
    }
    #status-pill {
      margin-top: 15px;
      font-size: 0.8rem;
      color: #38ef7d;
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="init-overlay">
    <h1>STARK INDUSTRIES // HALL OF ARMOR</h1>
    <p>
      Sit or stand in a clear play area. Seated mode raises your virtual viewpoint. Left thumbstick moves, right thumbstick turns. Pinch at wall cards to pull them toward you; X/Y opens the in-headset gesture guide and height settings.
    </p>
    <button class="action-btn" id="init-btn">INITIALIZE LABORATORY</button>
    <div id="status-pill">Ready to initialize...</div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { VRButton } from 'three/addons/webxr/VRButton.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { XRControllerModelFactory } from 'three/addons/webxr/XRControllerModelFactory.js';
    import { XRHandModelFactory } from 'three/addons/webxr/XRHandModelFactory.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
    import * as SkeletonUtils from 'three/addons/utils/SkeletonUtils.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
    import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

    // -------------------------------------------------------------
    // 1. RENDERER & CINEMATIC PBR TONEMAPPING
    // -------------------------------------------------------------
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x26384a);
    scene.fog = new THREE.FogExp2(0x17222f, 0.004);

    const renderer = new THREE.WebGLRenderer({ antialias: false });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
    renderer.xr.enabled = true;
    renderer.xr.setReferenceSpaceType('local-floor');
    renderer.xr.setFramebufferScaleFactor(1.05);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.75;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.xr.addEventListener('sessionstart', () => {
      renderer.shadowMap.enabled = false;
    });
    renderer.xr.addEventListener('sessionend', () => {
      renderer.shadowMap.enabled = true;
    });
    document.body.appendChild(renderer.domElement);

    // -------------------------------------------------------------
    // 2. SEATED CAMERA RIG & AUDIO LISTENER
    // -------------------------------------------------------------
    const cameraRig = new THREE.Group();
    cameraRig.position.set(0, 0, 1.35); // XR eye offset calibrated after headset tracking starts
    scene.add(cameraRig);

    // Seated users can choose a virtual standing-height eye point without
    // moving the physical floor, workbench, tracked controllers, or walls.
    let eyeMode = 'seated';
    let targetSeatedEyeHeight = 1.69;
    let lastPhysicalEyeHeight = null;
    let needsEyeCalibration = true;
    function applyEyeCalibration(frame) {
      if (!renderer.xr.isPresenting) return;
      const refSpace = renderer.xr.getReferenceSpace();
      const pose = frame && refSpace ? frame.getViewerPose(refSpace) : null;
      if (pose) lastPhysicalEyeHeight = pose.transform.position.y;
      if (eyeMode === 'standing') {
        cameraRig.position.y = 0;
        needsEyeCalibration = false;
      } else if (lastPhysicalEyeHeight !== null) {
        // In seated mode, the headset appears to be at normal standing eye level.
        cameraRig.position.y = THREE.MathUtils.clamp(targetSeatedEyeHeight - lastPhysicalEyeHeight, -0.30, 1.30);
        needsEyeCalibration = false;
      }
    }
    function changeEyeMode(mode) {
      eyeMode = mode;
      needsEyeCalibration = true;
      if (eyeMode === 'standing') cameraRig.position.y = 0;
      else if (lastPhysicalEyeHeight !== null)
        cameraRig.position.y = THREE.MathUtils.clamp(targetSeatedEyeHeight-lastPhysicalEyeHeight,-0.30,1.30);
      if (renderer.xr.isPresenting && menuVisible) positionMenuInFront();
    }
    function changeEyeHeight(by) {
      eyeMode = 'seated';
      targetSeatedEyeHeight = THREE.MathUtils.clamp(targetSeatedEyeHeight+by,1.32,2.02);
      needsEyeCalibration = true;
      if (lastPhysicalEyeHeight !== null)
        cameraRig.position.y = THREE.MathUtils.clamp(targetSeatedEyeHeight-lastPhysicalEyeHeight,-0.30,1.30);
      if (renderer.xr.isPresenting && menuVisible) positionMenuInFront();
    }
    renderer.xr.addEventListener('sessionstart',()=>{
      needsEyeCalibration = true;
      lastPhysicalEyeHeight = null;
    });
    renderer.xr.addEventListener('sessionend',()=>{
      cameraRig.position.y = 0;
      lastPhysicalEyeHeight = null;
    });

    const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.05, 50);
    cameraRig.add(camera);

    const audioListener = new THREE.AudioListener();
    camera.add(audioListener);
    const audioCtx = audioListener.context;

    // -------------------------------------------------------------
    // 2A. POST-PROCESSING: SUBTLE BLOOM FOR EMISSIVES
    // -------------------------------------------------------------
    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    const bloomPass = new UnrealBloomPass(
      new THREE.Vector2(window.innerWidth, window.innerHeight),
      0.5,   // strength — subtle, only emissives should glow
      0.55,  // radius
      0.72   // luminance threshold — keeps lit surfaces clean
    );
    composer.addPass(bloomPass);
    composer.addPass(new OutputPass());

    // -------------------------------------------------------------
    // 3. ENVIRONMENT LIGHTING & SHADOWS (PBR needs reflections)
    // -------------------------------------------------------------
    const pmrem = new THREE.PMREMGenerator(renderer);
    scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
    pmrem.dispose();

    const hemi = new THREE.HemisphereLight(0xbbeaff, 0x68788f, 2.0);
    scene.add(hemi);

    const keyLight = new THREE.DirectionalLight(0xffffff, 3.2);
    keyLight.position.set(-4, 8, 5);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.set(2048, 2048);
    keyLight.shadow.camera.left = -10;
    keyLight.shadow.camera.right = 10;
    keyLight.shadow.camera.top = 10;
    keyLight.shadow.camera.bottom = -10;
    keyLight.shadow.camera.near = 1;
    keyLight.shadow.camera.far = 25;
    keyLight.shadow.bias = -0.0004;
    scene.add(keyLight);

    // -------------------------------------------------------------
    // 4. PBR MATERIALS
    // -------------------------------------------------------------
    const materials = {
      gunmetal: new THREE.MeshStandardMaterial({ color: 0x23272e, metalness: 0.85, roughness: 0.35 }),
      arcWhite: new THREE.MeshBasicMaterial({ color: 0xffffff }),
      glossFloor: new THREE.MeshStandardMaterial({ color: 0x05080f, metalness: 0.85, roughness: 0.08 }),
      alcoveWall: new THREE.MeshStandardMaterial({ color: 0x141a24, metalness: 0.7, roughness: 0.5 }),
      lightPillar: new THREE.MeshBasicMaterial({ color: 0xffffff })
    };

    // -------------------------------------------------------------
    // 5. HALL OF ARMOR: CURVED BACK WALL WITH 7 ALCOVES
    // -------------------------------------------------------------
    const ALCOVE_COUNT = 7;
    const ARC_RADIUS = 6.2;
    const ARC_SPREAD = 0.9;
    const alcoveCenters = [];

    const floor = new THREE.Mesh(new THREE.CylinderGeometry(24.5, 24.5, 0.4, 64), materials.glossFloor);
    floor.position.y = -0.2;
    floor.receiveShadow = true;
    scene.add(floor);

    const canopyCurve = new THREE.Mesh(
      new THREE.TorusGeometry(ARC_RADIUS, 0.25, 12, 48, ARC_SPREAD),
      materials.gunmetal
    );
    canopyCurve.rotation.x = Math.PI / 2;
    canopyCurve.rotation.z = Math.PI / 2 - ARC_SPREAD / 2;
    canopyCurve.position.set(0, 3.4, -9.6);
    scene.add(canopyCurve);

    for (let i = 0; i < ALCOVE_COUNT; i++) {
      const t = (i / (ALCOVE_COUNT - 1)) - 0.5;
      const angle = t * ARC_SPREAD;
      const x = Math.sin(angle) * ARC_RADIUS;
      const z = -Math.cos(angle) * ARC_RADIUS - 5.3;

      const alcoveGroup = new THREE.Group();
      alcoveGroup.position.set(x, 0, z);
      alcoveGroup.rotation.y = angle;

      // Alcove interior sized snug around a ~2.0m suit
      const backPlate = new THREE.Mesh(new THREE.BoxGeometry(1.25, 2.7, 0.1), materials.alcoveWall);
      backPlate.position.set(0, 1.35, -0.55);
      alcoveGroup.add(backPlate);

      for (let y = 0.25; y < 2.55; y += 0.25) {
        const louver = new THREE.Mesh(new THREE.BoxGeometry(1.05, 0.035, 0.07), materials.gunmetal);
        louver.position.set(0, y, -0.49);
        alcoveGroup.add(louver);
      }

      const leftPillar = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.035, 2.7, 16), materials.lightPillar);
      leftPillar.position.set(-0.62, 1.35, 0);
      const rightPillar = leftPillar.clone();
      rightPillar.position.x = 0.62;
      alcoveGroup.add(leftPillar, rightPillar);

      const basePlatform = new THREE.Mesh(new THREE.BoxGeometry(1.05, 0.12, 0.85), materials.gunmetal);
      basePlatform.position.set(0, 0.06, 0);
      basePlatform.receiveShadow = true;
      alcoveGroup.add(basePlatform);

      const spotLight = new THREE.SpotLight(0xffeaad, 3.5, 7.5, Math.PI / 6, 0.4, 1.2);
      spotLight.position.set(0, 3.3, 0.2);
      spotLight.target.position.set(0, 1.0, 0);
      alcoveGroup.add(spotLight);
      alcoveGroup.add(spotLight.target);

      const uplight = new THREE.PointLight(0xffffff, 0.6, 2.5);
      uplight.position.set(0, 0.3, 0.2);
      alcoveGroup.add(uplight);

      scene.add(alcoveGroup);
      alcoveCenters.push({ group: alcoveGroup, position: new THREE.Vector3(x, 0.12, z), rotation: angle });
    }

    // -------------------------------------------------------------
    // PREMIUM VEHICLE SHOWROOM: TWO ILLUMINATED CONCEPT CAR DISPLAYS
    // Lightweight procedural vehicles suitable for Quest rendering.
    // -------------------------------------------------------------
    function addConceptVehicle(cx, cz, paint) {
      const bay = new THREE.Group();
      bay.position.set(cx,0,cz);
      bay.rotation.y = cx < 0 ? .28 : -.28;
      scene.add(bay);
      const black = new THREE.MeshStandardMaterial({color:0x090e15,metalness:.7,roughness:.22});
      const alloy = new THREE.MeshStandardMaterial({color:0x9bb3c3,metalness:.9,roughness:.18});
      const color = new THREE.MeshStandardMaterial({color:paint,metalness:.7,roughness:.19});
      const glass = new THREE.MeshStandardMaterial({color:0x142e41,metalness:.7,roughness:.11});
      const light = new THREE.MeshBasicMaterial({color:0xdafaff});
      const pad = new THREE.Mesh(new THREE.BoxGeometry(3.8,.14,2.35),black);
      pad.position.y=.10; bay.add(pad);
      for(const z of [-1.05,1.05]) {
        const rail = new THREE.Mesh(new THREE.BoxGeometry(3.55,.023,.045),light);
        rail.position.set(0,.18,z);bay.add(rail);
      }
      const base = new THREE.Mesh(new THREE.BoxGeometry(2.75,.36,1.35),color);
      base.position.set(0,.62,0);bay.add(base);
      const nose = new THREE.Mesh(new THREE.BoxGeometry(.75,.15,1.15),color);
      nose.position.set(-1.17,.49,0);bay.add(nose);
      const cab = new THREE.Mesh(new THREE.BoxGeometry(1.25,.38,1.08),glass);
      cab.position.set(.23,.95,0);bay.add(cab);
      const roof = new THREE.Mesh(new THREE.BoxGeometry(1.18,.055,1.02),color);
      roof.position.set(.23,1.16,0);bay.add(roof);
      const rimGeo = new THREE.CylinderGeometry(.38,.38,.19,20);
      for (const wheelX of [-.85,.92]) for (const wheelZ of [-.71,.71]) {
        const wheel = new THREE.Mesh(rimGeo,black);
        wheel.rotation.x = Math.PI/2;
        wheel.position.set(wheelX,.46,wheelZ);bay.add(wheel);
        const hub = new THREE.Mesh(new THREE.CylinderGeometry(.18,.18,.2,16),alloy);
        hub.rotation.x = Math.PI/2;
        hub.position.copy(wheel.position);bay.add(hub);
      }
      for (const wheelZ of [-.45,.45]) {
        const headlight = new THREE.Mesh(new THREE.BoxGeometry(.04,.07,.38),light);
        headlight.position.set(-1.42,.63,wheelZ);bay.add(headlight);
      }
      const overhead = new THREE.SpotLight(0xb9eeff,26,9,Math.PI/3,.6,1.5);
      overhead.position.set(0,4.5,0);
      overhead.target.position.set(0,.4,0);
      bay.add(overhead,overhead.target);
      const floorGlow = new THREE.PointLight(0x27baff,2.5,4);
      floorGlow.position.set(0,.3,0);bay.add(floorGlow);
    }
    addConceptVehicle(-7.0, 3.2, 0xb20e20);
    addConceptVehicle(7.0, 3.2, 0x33475c);
    const roomFill = new THREE.AmbientLight(0xdceaff,1.2);
    scene.add(roomFill);


    // -------------------------------------------------------------
    // 5B. JARVIS INTEGRATED WORKSHOP — FULL FUNCTIONAL BLOCKOUT
    // Deliberately lightweight: world geometry and local UI, no live cloud actions.
    // -------------------------------------------------------------
    const blockoutRoot = new THREE.Group(); scene.add(blockoutRoot);
    const blockoutTargets = []; // ray-interactable wall and workstation controls
    const movableCards = []; // controller grip or hand pinch can move these locally on each board
    const movableCardHits = [];
    const cardGrab = new Map();
    const cardPinch = new Map();
    const mkMat=(c, metal=.2)=>new THREE.MeshStandardMaterial({color:c,metalness:metal,roughness:.5});
    const blockMetal=mkMat(0x273746,.55), blockDark=mkMat(0x101923), blockLight=mkMat(0x9bb2c8);
    function block(parent,w,h,d,x,y,z,material=blockMetal){
      const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);
      m.position.set(x,y,z); parent.add(m);return m;
    }
    function signText(text,w=.9,h=.12,font=53,color='#effbff'){
      const cv=document.createElement('canvas');cv.width=1024;cv.height=128;
      const g=cv.getContext('2d');g.fillStyle=color;g.font=`bold ${font}px sans-serif`;
      g.textAlign='center';g.textBaseline='middle';g.fillText(text,512,64,1000);
      const tx=new THREE.CanvasTexture(cv);tx.colorSpace=THREE.SRGBColorSpace;
      const p=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({map:tx,transparent:true,side:THREE.DoubleSide}));return p;
    }
    function signOn(parent,text,x,y,z,width=1.6,height=.2){
      const sign=signText(text,width,height,57);sign.position.set(x,y,z);parent.add(sign);return sign;
    }
    // Exterior panorama seen through actual window openings. City blocks are placeholders.
    const skyBackdrop=new THREE.Mesh(new THREE.PlaneGeometry(31,9),new THREE.MeshBasicMaterial({color:0x436884,side:THREE.DoubleSide}));
    skyBackdrop.position.set(0,4.1,15.2);blockoutRoot.add(skyBackdrop);
    const skylineMat=[mkMat(0x27394a),mkMat(0x384d5b),mkMat(0x50637a)];
    for(let i=0;i<30;i++){
      const height=1.6+(i*7%9)*.35;
      block(blockoutRoot,.65+(i%3)*.14,height,.4,-14+i*.95,height/2,14.6,skylineMat[i%3]);
    }
    // Open window wall, with floor-to-ceiling glass and framing. Never blocks movement.
    const glassMat=new THREE.MeshPhysicalMaterial({color:0x9dcce7,metalness:.05,roughness:.11,transparent:true,opacity:.2,side:THREE.DoubleSide,depthWrite:false});
    const winFrame=mkMat(0x314655,.75);
    for(let i=0;i<7;i++){
      const x=-10.5+i*3.5;
      block(blockoutRoot,3.25,3.05,.035,x,2.15,12.5,glassMat);
      block(blockoutRoot,.1,3.25,.13,x-1.7,2.15,8.35,winFrame);
      block(blockoutRoot,.1,3.25,.13,x+1.7,2.15,8.35,winFrame);
      block(blockoutRoot,3.4,.1,.15,x,3.75,12.5,winFrame);
      block(blockoutRoot,3.4,.11,.17,x,.52,12.5,winFrame);
    }
    // Ceiling beams and economical light strips.
    for(let x of [-10,0,10]){
      block(blockoutRoot,.22,.18,24,x,4.7,.6,winFrame);
      for(let z of [-9,-4,1,6,11])block(blockoutRoot,.09,.045,2.7,x,4.56,z,new THREE.MeshBasicMaterial({color:0xffffff}));
    }
    scene.add(new THREE.HemisphereLight(0xffffff,0x8597aa,1.3));
    const taskLight=new THREE.PointLight(0xf4faff,16,23,2);taskLight.position.set(0,3.9,4);scene.add(taskLight);
    // Bright, evenly distributed ceiling light banks. Low shadow cost for Quest.
    const ceilingLightMat = new THREE.MeshBasicMaterial({color:0xf4fcff});
    for (const x of [-9,-3,3,9]) for(const z of [-7,-1,5,10]) {
      block(blockoutRoot,2.4,.055,.36,x,4.54,z,ceilingLightMat);
    }
    for(const x of [-9,0,9]) {
      const light = new THREE.PointLight(0xffffff,7.5,17,2);
      light.position.set(x,4.28,0);scene.add(light);
    }
    // Wall board system. Boards are real 3D objects; content represents app integration stubs.
    const panelStatus={
      '3D PRINTING':['P1S A — demo queue','P1S B — demo queue','Falcon 2 22W — demo queue','Filament inventory — demo'],
      'BUSINESS':['Products / orders','Quotes and pricing','Customer catalogue','Sales overview'],
      'LIFE TASKS':['Today and tomorrow','Calendar / reminders','Daily routines','Personal dashboard'],
      'NOTES':['Jobsite memory','Room measurements','Materials / photos','Voice notes'],
      'IDEAS':['New product sketches','Design research','MakerWorld concepts','Jarvis suggestions']
    };
    let selectedBoard='3D PRINTING';
    const infoBoard=new THREE.Group();blockoutRoot.add(infoBoard);
    infoBoard.position.set(0,2.05,3.2);
    const infoFace=block(infoBoard,2.6,1.52,.06,0,0,0,blockDark);
    infoFace.material=new THREE.MeshBasicMaterial({color:0x081724,transparent:true,opacity:.97,side:THREE.DoubleSide});
    let infoLines=[];
    function displayBoard(section){
      selectedBoard=section;
      infoLines.forEach(m=>infoBoard.remove(m)); infoLines=[];
      const lines=['JARVIS // '+section,...panelStatus[section],'DEMO ONLY  •  DATA NOT CONNECTED'];
      lines.forEach((t,i)=>{
        const p=signText(t,2.4,i===0?.17:.13,i===0?54:44,i===0?'#77e5ff':'#f4fbff');
        p.position.set(0,.55-i*.21,.06);infoBoard.add(p);infoLines.push(p);
      });
    }
    displayBoard('3D PRINTING');
    const walls=[
      ['3D PRINTING',-12.2,1.9,-5.3,Math.PI/2],
      ['BUSINESS',-12.2,1.9,2.0,Math.PI/2],
      ['LIFE TASKS',12.2,1.9,-5.3,-Math.PI/2],
      ['NOTES',12.2,1.9,2.0,-Math.PI/2],
      ['IDEAS',0,1.9,11.5,Math.PI]
    ];
    walls.forEach(([name,x,y,z,rot])=>{
      const group=new THREE.Group();group.position.set(x,y,z);group.rotation.y=rot;blockoutRoot.add(group);
      block(group,2.65,1.7,.16,0,0,0,blockMetal);
      block(group,2.48,1.48,.02,0,0,.09,new THREE.MeshBasicMaterial({color:0x0b2330}));
      signOn(group,name,0,.53,.12,2.36,.21);
      panelStatus[name].forEach((line,i)=>{
        // Task cards are separate objects, keeping their text and backing together.
        const card=new THREE.Group();card.position.set(0,.19-i*.25,.15);
        group.add(card);
        const bg=block(card,2.26,.205,.015,0,0,0,new THREE.MeshBasicMaterial({color:i%2?0x254454:0x1b3b4d}));
        const label=signText(line,2.13,.137,48,'#f3fcff');
        label.position.z=.014;card.add(label);
        const hit=new THREE.Mesh(new THREE.PlaneGeometry(2.27,.211),new THREE.MeshBasicMaterial({visible:false,side:THREE.DoubleSide}));
        hit.position.z=.025;card.add(hit);
        hit.userData.card=card;card.userData.board=group;
        card.userData.homePosition=card.position.clone();
        card.userData.homeQuaternion=card.quaternion.clone();
        card.userData.homeScale=card.scale.clone();
        card.userData.undocked=false;
        movableCards.push(card);movableCardHits.push(hit);
      });
      const clickTarget=new THREE.Mesh(new THREE.PlaneGeometry(2.5,1.55),new THREE.MeshBasicMaterial({visible:false,side:THREE.DoubleSide}));
      clickTarget.position.z=.15;clickTarget.userData.action=()=>displayBoard(name);group.add(clickTarget);blockoutTargets.push(clickTarget);
      const lamp=new THREE.PointLight(0x73dafa,.75,2.9);lamp.position.set(0,.35,.3);group.add(lamp);
    });
    // Executive desk + Jarvis command console; blockout placeholders with click actions.
    const desk=new THREE.Group();desk.position.set(4.7,0,-6.3);blockoutRoot.add(desk);
    block(desk,2.9,.13,1.3,0,.79,0,blockLight);
    for(let x of [-1.2,1.2])for(let z of [-.5,.5])block(desk,.12,.75,.12,x,.37,z);
    block(desk,1.5,.85,.06,0,1.37,-.42,new THREE.MeshBasicMaterial({color:0x10354d}));
    signOn(desk,'JARVIS COMMAND',0,1.51,-.38,1.35,.14);
    signOn(desk,'VOICE / APP / PROJECTS',0,1.25,-.37,1.34,.1);
    const deskTap=new THREE.Mesh(new THREE.PlaneGeometry(1.65,.82),new THREE.MeshBasicMaterial({visible:false,side:THREE.DoubleSide}));
    deskTap.position.set(0,1.36,-.35);deskTap.userData.action=()=>displayBoard('LIFE TASKS');desk.add(deskTap);blockoutTargets.push(deskTap);
    // Maker corner with both P1S printers, 22W laser, labelled filament shelving.

    function createUprightSuit(model) {
      // Bounds are measured in the source model's own coordinates.
      // Keep Y pointing upward; the former -90-degree X rotation caused
      // both the alcove models and the workbench hologram to lie down.
      model.updateMatrixWorld(true);
      const bounds = new THREE.Box3().setFromObject(model);
      const size = new THREE.Vector3();
      const center = new THREE.Vector3();
      bounds.getSize(size);
      bounds.getCenter(center);
      const scale = size.y > 0.001 ? SUIT_HEIGHT_METERS / size.y : 1;
      const uprightSuit = new THREE.Group();
      const content = new THREE.Group();
      model.position.x -= center.x;
      model.position.y -= bounds.min.y;
      model.position.z -= center.z;
      content.add(model);
      uprightSuit.scale.setScalar(scale);
      uprightSuit.add(content);
      return uprightSuit;
    }

    function addForgeShape(type) {
      let geometry;
      switch (type) {
        case 'cube': case 'box': geometry = new THREE.BoxGeometry(0.22, 0.22, 0.22); break;
        case 'sphere': geometry = new THREE.SphereGeometry(0.14, 24, 18); break;

        case 'pyramid': geometry = new THREE.ConeGeometry(0.15, 0.24, 4); break;
        default: return null;

      const mesh = new THREE.Mesh(geometry, forgeMaterial(forgeColor));
      // White schematic edges make it read as a Stark CAD hologram
      const edges = new THREE.LineSegments(
        new THREE.EdgesGeometry(geometry),
        new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.45 })
      );
      mesh.add(edges);
      // Arrange successive shapes in a loose cluster above the pad
      const n = forgeShapes.length;
      mesh.position.set((n % 3 - 1) * 0.26, 0.2 + Math.floor(n / 3) * 0.3, 0);
      forgeGroup.add(mesh);

    // 9. PROCEDURAL SOUND SYNTHESIS ENGINE (No External MP3s Needed)
    // -------------------------------------------------------------
    function createChimeBuffer() {
      const sampleRate = audioCtx.sampleRate;
      const duration = 0.22;
      const buffer = audioCtx.createBuffer(1, sampleRate * duration, sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < buffer.length; i++) {
        const t = i / sampleRate;
        const env = Math.exp(-t * 22);
        data[i] = (Math.sin(2 * Math.PI * 1174 * t) * 0.6 + Math.sin(2 * Math.PI * 1760 * t) * 0.4) * env;
      }
      return buffer;
    }

    function createSurgeBuffer() {
      const sampleRate = audioCtx.sampleRate;
      const duration = 1.0;
      const buffer = audioCtx.createBuffer(1, sampleRate * duration, sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < buffer.length; i++) {
        const t = i / sampleRate;
        const env = Math.exp(-t * 4);
        const sub = Math.sin(2 * Math.PI * 62 * t) * 0.5;
        const harmonic = Math.sin(2 * Math.PI * 124 * t) * 0.3;
        const hiss = (Math.random() * 2 - 1) * 0.2;
        data[i] = (sub + harmonic + hiss) * 0.6 * env;
      }
      return buffer;
    }

    function createServoBuffer() {
      const sampleRate = audioCtx.sampleRate;
      const duration = 0.15;
      const buffer = audioCtx.createBuffer(1, sampleRate * duration, sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < buffer.length; i++) {
        const t = i / sampleRate;
        const freq = 420 - t * 1800;
        const env = Math.exp(-t * 28);
        data[i] = Math.sin(2 * Math.PI * Math.max(freq, 40) * t) * env * 0.8;
      }
      return buffer;
    }

    function createGrabBuffer() {
      const sampleRate = audioCtx.sampleRate;
      const duration = 0.08;
      const buffer = audioCtx.createBuffer(1, sampleRate * duration, sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < buffer.length; i++) {
        const t = i / sampleRate;
        const env = Math.exp(-t * 60);
        data[i] = ((Math.random() * 2 - 1) * 0.4 + Math.sin(2 * Math.PI * 880 * t) * 0.6) * env;
      }
      return buffer;
    }

    let bufChime, bufSurge, bufServo, bufGrab;
    function initBuffers() {
      bufChime = createChimeBuffer();
      bufSurge = createSurgeBuffer();
      bufServo = createServoBuffer();
      bufGrab = createGrabBuffer();
    }

    function playPositional(audio, buffer) {
      if (!buffer) return;
      if (audio.isPlaying) audio.stop();
      audio.setBuffer(buffer);
      audio.play();
    }

    function jarvisSpeak(phrase) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(phrase);
      const voices = window.speechSynthesis.getVoices();
      const british = voices.find(v => v.lang.includes('en-GB') || v.name.includes('UK') || v.name.includes('George'));
      if (british) utterance.voice = british;
      utterance.pitch = 0.95;
      utterance.rate = 1.0;
      window.speechSynthesis.speak(utterance);
    }

    function handleJarvisCommand(rawTranscript) {
      const text = rawTranscript.toLowerCase().trim();

      if (text.includes("exit") || text.includes("quit") || text.includes("power down") || text.includes("close simulation")) {
        exitSimulation();
      } else if (text.includes("mask") || text.includes("faceplate")) {
        if (text.includes("close") || text.includes("shut")) toggleMask(false);
        else toggleMask(true);
      } else if (text.includes("explode") || text.includes("disassemble") || text.includes("expand")) {
        toggleExplode(true);
      } else if (text.includes("assemble") || text.includes("collapse") || text.includes("put back")) {
        toggleExplode(false);
      } else if (text.includes("clear forge")) {
        clearForge();
        jarvisSpeak("Forge pad cleared.");
      } else if (text.includes("forge") || text.includes("create") || text.includes("add a") || text.includes("make a")) {
        const found = ["cube", "box", "sphere", "cylinder", "torus", "cone", "pyramid"].find(t => text.includes(t));
        if (found) {
          addForgeShape(found);
          jarvisSpeak(`Forging ${found === "box" ? "cube" : found} hologram, sir.`);
        } else if (text.includes("bigger") || text.includes("larger")) {
          scaleLastForgeShape(1.25);
        } else if (text.includes("smaller") || text.includes("shrink")) {
          scaleLastForgeShape(0.8);
        } else {
          jarvisSpeak("Specify a shape, sir: cube, sphere, cylinder, torus, cone, or pyramid.");
        }
      } else if (text.includes("shape") && (text.includes("bigger") || text.includes("larger") || text.includes("grow"))) {
        scaleLastForgeShape(1.25);
      } else if (text.includes("shape") && (text.includes("smaller") || text.includes("shrink"))) {
        scaleLastForgeShape(0.8);
      } else if (text.includes("wireframe")) {
        toggleForgeWireframe();
      } else if (text.includes("spin") && (text.includes("shape") || text.includes("forge"))) {
        forgeSpin = !forgeSpin;
        jarvisSpeak(forgeSpin ? "Rotating the forge model." : "Rotation halted.");
      } else if (text.includes("make it") || text.includes("colour") || text.includes("color")) {
        const colorName = Object.keys(FORGE_COLORS).find(c => text.includes(c));
        if (colorName && colorLastForgeShape(colorName)) {
          jarvisSpeak(`Recalibrating forge emission to ${colorName}.`);
        } else if (colorName) {
          jarvisSpeak("The forge pad is empty, sir. Create a shape first.");
        }
      } else if (text.includes("rotate left")) {
        holoRig.rotation.y -= 0.6;
      } else if (text.includes("rotate right")) {
        holoRig.rotation.y += 0.6;
      } else if (text.includes("scale up") || text.includes("bigger")) {
        holoRig.scale.multiplyScalar(1.25).clampScalar(0.25, 1.8);
      } else if (text.includes("scale down") || text.includes("smaller")) {
        holoRig.scale.multiplyScalar(0.8).clampScalar(0.25, 1.8);
      } else if (text.includes("status") || text.includes("hello")) {
        jarvisSpeak("All workshop telemetry and gestural sensors are nominal, sir.");
      }
    }

    function getSourcePoint(source){

        const a=new THREE.Vector3(),b=new THREE.Vector3();

    function setRayFromController(controller){

    function setRayFromHand(hand){

      tip.getWorldPosition(tmpJointPos);
      proximal.getWorldPosition(tmpJointPos2);
      const dir=tmpJointPos.clone().sub(tmpJointPos2);
      if(dir.lengthSq()<.0001)return false;
      cardRay.ray.origin.copy(tmpJointPos);

    function startCardGrab(source,card){

        forward.y=0;if(forward.lengthSq()<.001)forward.set(0,0,-1);forward.normalize();
        const right=new THREE.Vector3(-forward.z,0,forward.x);
        const side=(source===hand0||source===c0)?-.22:.22;

        card.position.y=eye.y-.22;

        if(delta.length()<.35){
          grab.card.position.add(delta);
          grab.card.position.y=THREE.MathUtils.clamp(grab.card.position.y,.65,2.7);

    function updateHandCardPinches(){

          cardGrab.delete(hand);cardPinch.set(hand,false);
          handPinchSince.delete(hand);handPointerBeams[index].visible=false;continue;
        }
        const a=thumb.getWorldPosition(new THREE.Vector3());
        const b=tip.getWorldPosition(new THREE.Vector3());
        const distance=a.distanceTo(b);
        const previous=!!cardPinch.get(hand);
        const pinching=previous?distance<.052:distance<.036;
        const hasRay=setRayFromHand(hand);
        let target=null,targetPoint=null;
        if(hasRay){
          const candidates=menuVisible?activeMenuButtons():movableCardHits;
          const hits=cardRay.intersectObjects(candidates,false);
          if(hits.length){target=hits[0].object;targetPoint=hits[0].point.clone();}
        }
        setHandBeam(index,cardRay.ray,targetPoint);
        if(pinching&&!previous){
          handPinchSince.set(hand,performance.now());
          if(menuVisible){
            let button=target;
            if(!button){
              // Touching a visible button directly also counts as a click.
              for(const candidate of activeMenuButtons()){
                candidate.getWorldPosition(tmpCardWorld);
                if(tmpCardWorld.distanceTo(b)<.13){button=candidate;break;}
              }
            }
            if(button?.userData.action)button.userData.action();
          }else{
            let selected=null,nearest=.23;
            for(const card of movableCards){
              card.getWorldPosition(tmpCardWorld);
              const dist=b.distanceTo(tmpCardWorld);
              if(dist<nearest){selected=card;nearest=dist;}
            }
            if(!selected&&target)selected=target.userData.card;
            if(selected)startCardGrab(hand,selected);
          }
        }
        if(!pinching){cardGrab.delete(hand);handPinchSince.delete(hand);}
        cardPinch.set(hand,pinching);
      }
      // Hands-only menu shortcut: pinch BOTH hands for 0.6s while not holding cards.
      const a=handPinchSince.get(hand0),b=handPinchSince.get(hand1);
      if(a&&b&&cardGrab.size===0){
        if(!handsMenuLatch&&performance.now()-Math.max(a,b)>.6*1000){
          handsMenuLatch=true;
          setMenuVisible(!menuVisible);
        }
      }else handsMenuLatch=false;
    }
    // Two-Hand Pinch & Pull tracker
    const grabState = {
      h0Pinching: false,
      h1Pinching: false,
      initialDistance: 0,
      initialScale: 0.65,
      forgeTarget: false
    };

    // One-Hand Grab & Rotate tracker (with tap-vs-drag detection for mask toggle)
    const dragState = {
      active: false,
      controller: null,
      lastPos: new THREE.Vector3(),
      moved: 0,
      startTime: 0,
      startedOnButton: false,
      forgeTarget: false
    };

    function onSelectStart(event) {
      const controller = event.target;
      tempMatrix.identity().extractRotation(controller.matrixWorld);
      raycaster.ray.origin.setFromMatrixPosition(controller.matrixWorld);
      raycaster.ray.direction.set(0, 0, -1).applyMatrix4(tempMatrix);

      // 1. Interactive terminal buttons take priority
      const hits = raycaster.intersectObjects(menuVisible ? activeMenuButtons() : (renderer.xr.isPresenting ? blockoutTargets : [...blockoutTargets, ...clickableButtons.filter(b => !menuButtons.includes(b))]), false);
      if (hits.length > 0) {
        const hit = hits[0].object;
        if (hit.userData.action) {
          hit.userData.action();
          playPositional(termAudio, bufChime);
          dragState.startedOnButton = true;
          return;
        }
      }

      if(menuVisible) return; // Never drag workshop models while using a floating menu.

      // 2. Forge pad proximity determines the gesture target
      const forgeWorld = new THREE.Vector3();
      forgeGroup.getWorldPosition(forgeWorld);
      const nearForge = raycaster.ray.origin.distanceTo(forgeWorld) < 0.55;

      // 3. Track pinch state
      if (controller === c0) grabState.h0Pinching = true;
      if (controller === c1) grabState.h1Pinching = true;

      if (grabState.h0Pinching && grabState.h1Pinching) {
        // Two-handed scale: capture baseline
        const p0 = new THREE.Vector3();
        const p1 = new THREE.Vector3();
        c0.getWorldPosition(p0);
        c1.getWorldPosition(p1);
        grabState.initialDistance = p0.distanceTo(p1);
        grabState.forgeTarget = nearForge || dragState.forgeTarget;
        grabState.initialScale = grabState.forgeTarget ? forgeGroup.scale.x : holoRig.scale.x;
        dragState.active = false;
        dragState.controller = null;
      } else {
        // One-handed grab: begin rotate/drag tracking
        dragState.active = true;
        dragState.controller = controller;
        dragState.forgeTarget = nearForge;
        controller.getWorldPosition(dragState.lastPos);
        dragState.moved = 0;
        dragState.startTime = performance.now();
        dragState.startedOnButton = false;
        playPositional(controller === c0 ? grabAudio0 : grabAudio1, bufGrab);
      }
    }

    function onSelectEnd(event) {
      const controller = event.target;
      if (controller === c0) grabState.h0Pinching = false;
      if (controller === c1) grabState.h1Pinching = false;
      if (!grabState.h0Pinching && !grabState.h1Pinching) grabState.forgeTarget = false;

      if (dragState.startedOnButton) {
        dragState.startedOnButton = false;
        return;
      }

      if (dragState.active && dragState.controller === controller) {
        // Quick tap (no drag): forge tap toggles wireframe, otherwise faceplate
        const quickTap = (performance.now() - dragState.startTime) < 300 && dragState.moved < 0.02;
        const wasForge = dragState.forgeTarget;
        dragState.active = false;
        dragState.controller = null;
        dragState.forgeTarget = false;
        if (quickTap) {
          if (wasForge) toggleForgeWireframe();
          else toggleMask();
        }
      }
    }

    // Grip on a wall task card grabs it; otherwise keep the existing armour gesture.
    function onSqueezeStart(event) {
      if(menuVisible)return;
      if(gripCardStart(event))return;
      playPositional(event.target === c0 ? grabAudio0 : grabAudio1, bufGrab);
      toggleExplode();
    }
    function onSqueezeEnd(event){cardGrab.delete(event.target);}

    [c0, c1].forEach(c => {
      c.addEventListener('selectstart', onSelectStart);
      c.addEventListener('selectend', onSelectEnd);
      c.addEventListener('squeezestart', onSqueezeStart);
      c.addEventListener('squeezeend', onSqueezeEnd);
    });

    // -------------------------------------------------------------
    // 15. LOCOMOTION, DRAG-ROTATE & TWO-HAND EXPAND GESTURE
    // -------------------------------------------------------------
    const clock = new THREE.Clock();

    const menuButtonLast = new WeakMap();
    function handleInput(delta, xrFrame) {
      const session = renderer.xr.getSession();

      // One-hand grab: near the forge you move shapes, near the suit you rotate it
      if (dragState.active && dragState.controller && !(grabState.h0Pinching && grabState.h1Pinching)) {
        const pos = new THREE.Vector3();
        dragState.controller.getWorldPosition(pos);
        const dx = pos.x - dragState.lastPos.x;
        const dy = pos.y - dragState.lastPos.y;
        const dz = pos.z - dragState.lastPos.z;
        if (dragState.forgeTarget) {
          forgeGroup.position.x += dx;
          forgeGroup.position.z += dz;
          forgeGroup.position.y = THREE.MathUtils.clamp(forgeGroup.position.y + dy, 1.0, 1.9);
        } else {
          holoRig.position.x = THREE.MathUtils.clamp(holoRig.position.x + dx, -1.1, 1.1);
          holoRig.position.z = THREE.MathUtils.clamp(holoRig.position.z + dz, -1.1, 1.1);
          holoBaseY = THREE.MathUtils.clamp(holoBaseY + dy, 0.65, 2.2);
        }
        dragState.moved += Math.abs(dx) + Math.abs(dy) + Math.abs(dz);
        dragState.lastPos.copy(pos);
      }

      if (!session) return;

      // Two-Handed Pinch & Pull (scales the forge model or the suit hologram)
      if (grabState.h0Pinching && grabState.h1Pinching && grabState.initialDistance > 0.05) {
        const p0 = new THREE.Vector3();
        const p1 = new THREE.Vector3();
        c0.getWorldPosition(p0);
        c1.getWorldPosition(p1);
        const currentDist = p0.distanceTo(p1);
        const scaleMultiplier = currentDist / grabState.initialDistance;
        if (grabState.forgeTarget) {
          forgeGroup.scale.setScalar(THREE.MathUtils.clamp(grabState.initialScale * scaleMultiplier, 0.4, 2.5));
        } else {
          holoRig.scale.setScalar(THREE.MathUtils.clamp(grabState.initialScale * scaleMultiplier, 0.25, 1.8));
        }
      }

      // Thumbstick Locomotion & Suit Control
      for (const source of session.inputSources) {
        if (!source.gamepad) continue;
        const axes = source.gamepad.axes;
        const x = Math.abs(axes[2]) > 0.05 ? axes[2] : (Math.abs(axes[0]) > 0.05 ? axes[0] : 0);
        const y = Math.abs(axes[3]) > 0.05 ? axes[3] : (Math.abs(axes[1]) > 0.05 ? axes[1] : 0);

        // Left thumbstick: move in the HMD's CURRENT facing direction, not
        // the original room direction. Viewer pose is floor-local; apply rig yaw.
        if (source.handedness === 'left' && (Math.abs(x) > 0.15 || Math.abs(y) > 0.15)) {
          const facingQ = new THREE.Quaternion();
          const referenceSpace = renderer.xr.getReferenceSpace();
          const pose = xrFrame && referenceSpace ? xrFrame.getViewerPose(referenceSpace) : null;
          if (pose) {
            const q = pose.transform.orientation;
            facingQ.set(q.x,q.y,q.z,q.w);
            facingQ.premultiply(cameraRig.quaternion);
          } else {
            renderer.xr.getCamera(camera).getWorldQuaternion(facingQ);
          }
          const forward = new THREE.Vector3(0,0,-1).applyQuaternion(facingQ);
          forward.y = 0;
          if (forward.lengthSq() < .001) forward.set(0,0,-1);
          forward.normalize();
          const right = new THREE.Vector3(-forward.z,0,forward.x);
          cameraRig.position.addScaledVector(forward,-y * 4.0 * delta);
          cameraRig.position.addScaledVector(right,x * 4.0 * delta);
        }

        // Right thumbstick rotates VIEW, not the workshop model.
        if (source.handedness === 'right' && Math.abs(x) > 0.18) {
          cameraRig.rotation.y -= x * 2.0 * delta;
        }
        // X/Y on left Quest controller toggles the library.
        if (source.handedness === 'left') {
          const pressed = !!(source.gamepad.buttons[4]?.pressed || source.gamepad.buttons[5]?.pressed);
          const previous = menuButtonLast.get(source) || false;
          if (pressed && !previous) setMenuVisible(!menuVisible);
          menuButtonLast.set(source, pressed);
        }
      }
    }

    // -------------------------------------------------------------
    // 16. MAIN ANIMATION LOOP
    // -------------------------------------------------------------
    renderer.setAnimationLoop((timestamp, xrFrame) => {
      const delta = clock.getDelta();
      const time = timestamp * 0.001;

      if(needsEyeCalibration && renderer.xr.isPresenting)applyEyeCalibration(xrFrame);
      handleInput(delta, xrFrame);
      if(renderer.xr.isPresenting){updateHandCardPinches();updateCardGrabs();}
      if (menuVisible && renderer.xr.isPresenting && (!menuPositioned || menuRepositionFrames>0)) { positionMenuInFront(); menuPositioned=true; if(menuRepositionFrames>0)menuRepositionFrames--; }

      // Faceplate & explode actuation (segmented fallback hologram only —
      // the GLB hologram has no named faceplate/limb nodes to drive)
      if (!holoIsGLB) {
        const targetMask = isMaskOpen ? 1.0 : 0.0;
        maskProgress += (targetMask - maskProgress) * 0.12;
        holoSuit.faceplate.position.y = 0.01 + maskProgress * 0.07;
        holoSuit.faceplate.position.z = 0.08 - maskProgress * 0.02;
        holoSuit.faceplate.rotation.x = -maskProgress * (Math.PI / 4);

        const targetExplode = isExploded ? 1.0 : 0.0;
        explodeProgress += (targetExplode - explodeProgress) * 0.08;
        holoSuit.helmet.position.y = 1.62 + explodeProgress * 0.18;
        holoSuit.torso.position.z = explodeProgress * 0.08;
        holoSuit.armL.position.x = -0.25 - explodeProgress * 0.15;
        holoSuit.armR.position.x = 0.25 + explodeProgress * 0.15;
        holoSuit.legL.position.y = 0.9 - explodeProgress * 0.14;
        holoSuit.legR.position.y = 0.9 - explodeProgress * 0.14;
      }

      // Idle life: gimbal spin, gentle hover bob, light flicker
      gimbalRing1.rotation.z = time * 0.3;
      holoRig.position.y = holoBaseY + Math.sin(time * 1.2) * 0.025;
      holoLight.intensity = 2.6 + Math.sin(time * 2.2) * 0.25;

      // Holo-forge: optional spin + emitter pad pulse
      if (forgeSpin) forgeGroup.rotation.y += delta * 0.8;
      forgePad.material.opacity = 0.55 + Math.sin(time * 3) * 0.2;

      // DamagedHelmet turntable
      helmetAnchor.rotation.y = time * 0.4;

      if (renderer.xr.isPresenting) {
        renderer.render(scene, camera);
      } else {
        composer.render();
      }
    });

    // -------------------------------------------------------------
    // 17. INITIALIZATION TRIGGER & AUDIO UNLOCK
    // -------------------------------------------------------------
    document.getElementById('init-btn').addEventListener('click', async () => {
      if (audioCtx.state === 'suspended') {
        await audioCtx.resume();
      }

      initBuffers();
      initSpeechEngine();
      drawTerminalUI();

      jarvisSpeak("Welcome back, sir. Hall of Armor and command terminal are online.");
      document.getElementById('status-pill').textContent = 'J.A.R.V.I.S. online — systems nominal.';
      document.getElementById('init-overlay').style.display = 'none';
      document.body.appendChild(VRButton.createButton(renderer));
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      composer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
