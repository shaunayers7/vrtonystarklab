<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stark Industries // Malibu Lab & 3D Spatial Audio</title>
  <style>
    body {
      margin: 0;
      background-color: #040810;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      color: #00f0ff;
    }
    #launch-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      background: rgba(8, 14, 26, 0.95);
      border: 1px solid rgba(0, 240, 255, 0.4);
      padding: 30px 40px;
      border-radius: 12px;
      box-shadow: 0 0 35px rgba(0, 240, 255, 0.25);
      max-width: 500px;
      z-index: 999;
    }
    #launch-overlay h1 {
      margin: 0 0 10px;
      font-size: 1.4rem;
      letter-spacing: 3px;
      text-transform: uppercase;
    }
    #launch-overlay p {
      font-size: 0.9rem;
      color: #8be4fc;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .action-btn {
      background: linear-gradient(135deg, #00d2ff 0%, #0077ff 100%);
      color: #fff;
      border: none;
      padding: 12px 28px;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      border-radius: 6px;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(0, 210, 255, 0.5);
      transition: all 0.2s ease;
    }
    .action-btn:hover {
      transform: scale(1.04);
      box-shadow: 0 0 25px rgba(0, 210, 255, 0.8);
    }
    #status-pill {
      margin-top: 15px;
      font-size: 0.8rem;
      color: #38ef7d;
    }
    #holo-loader {
      position: fixed;
      left: 16px;
      bottom: 16px;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      border: 1px solid rgba(0, 240, 255, 0.45);
      border-radius: 8px;
      background: rgba(4, 12, 22, 0.9);
      box-shadow: 0 0 20px rgba(0, 210, 255, 0.16);
      font-size: 0.78rem;
    }
    #holo-image-input {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
    }
    #holo-loader label,
    #restore-armor {
      border: 1px solid rgba(0, 240, 255, 0.6);
      border-radius: 5px;
      padding: 8px 10px;
      color: #8be4fc;
      background: rgba(0, 100, 140, 0.2);
      cursor: pointer;
      font: inherit;
    }
    #holo-status {
      color: #b7cad5;
      max-width: 260px;
    }
    @media (max-width: 600px) {
      #holo-loader {
        left: 8px;
        right: 8px;
        bottom: 8px;
        flex-wrap: wrap;
      }
      #holo-status {
        max-width: none;
      }
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="launch-overlay">
    <h1>Stark Malibu Lab</h1>
    <p>
      Click below to initialize the <strong>3D Spatial Audio Engine & J.A.R.V.I.S.</strong>, then put on your Quest 3 and enter VR.
    </p>
    <button class="action-btn" id="init-btn">INITIALIZE AUDIO & VR</button>
    <div id="status-pill">Awaiting authorization...</div>
  </div>
  <div id="holo-loader">
    <label for="holo-image-input">LOAD HOLOGRAM IMAGE</label>
    <input id="holo-image-input" type="file" accept="image/*" capture="environment" aria-label="Capture or load a hologram image" />
    <button id="restore-armor" type="button">RESTORE ARMOR</button>
    <span id="holo-status" aria-live="polite">Articulated armor ready. In VR, say “wave”, “pose”, “walk”, or “neutral”.</span>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { VRButton } from 'three/addons/webxr/VRButton.js';
    import { XRControllerModelFactory } from 'three/addons/webxr/XRControllerModelFactory.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

    // -------------------------------------------------------------
    // 1. SCENE SETUP & RENDERER
    // -------------------------------------------------------------
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x050a12);
    scene.fog = new THREE.FogExp2(0x050a12, 0.035);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.xr.enabled = true;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    document.body.appendChild(renderer.domElement);
    const environmentGenerator = new THREE.PMREMGenerator(renderer);
    scene.environment = environmentGenerator.fromScene(new RoomEnvironment(), 0.04).texture;
    environmentGenerator.dispose();

    const roomLight = new THREE.HemisphereLight(0x8bdfff, 0x101522, 1.15);
    scene.add(roomLight);

    const keyLight = new THREE.DirectionalLight(0xe5f5ff, 1.6);
    keyLight.position.set(-5, 9, 5);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.set(1024, 1024);
    keyLight.shadow.camera.left = -13;
    keyLight.shadow.camera.right = 13;
    keyLight.shadow.camera.top = 8;
    keyLight.shadow.camera.bottom = -3;
    scene.add(keyLight);

    // -------------------------------------------------------------
    // 2. PLAYER RIG & 3D AUDIO LISTENER
    // -------------------------------------------------------------
    const cameraRig = new THREE.Group();
    cameraRig.position.set(0, 0, 1.8);
    scene.add(cameraRig);

    const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.05, 50);
    cameraRig.add(camera);

    // Attach Three.js AudioListener to the user's head
    const audioListener = new THREE.AudioListener();
    camera.add(audioListener);

    // -------------------------------------------------------------
    // 3. PROCEDURAL SOUND SYNTHESIS ENGINE (No External MP3s Needed)
    // -------------------------------------------------------------
    const audioCtx = audioListener.context;

    // Buffer 1: Futuristic Tablet UI Chime
    function createChimeBuffer() {
      const sampleRate = audioCtx.sampleRate;
      const duration = 0.22;
      const buffer = audioCtx.createBuffer(1, sampleRate * duration, sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < buffer.length; i++) {
        const t = i / sampleRate;
        const env = Math.exp(-t * 22);
        // Dual-harmonic chime: 1174Hz (D6) + 1760Hz (A6)
        data[i] = (Math.sin(2 * Math.PI * 1174 * t) * 0.6 + Math.sin(2 * Math.PI * 1760 * t) * 0.4) * env;
      }
      return buffer;
    }

    // Buffer 2: Heavy 60Hz Plasma Torch Energy Buzz (Loopable)
    function createPlasmaBuzzBuffer() {
      const sampleRate = audioCtx.sampleRate;
      const duration = 1.0;
      const buffer = audioCtx.createBuffer(1, sampleRate * duration, sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < buffer.length; i++) {
        const t = i / sampleRate;
        const sub = Math.sin(2 * Math.PI * 62 * t) * 0.5;
        const harmonic = Math.sin(2 * Math.PI * 124 * t) * 0.3;
        const hiss = (Math.random() * 2 - 1) * 0.2;
        data[i] = (sub + harmonic + hiss) * 0.6;
      }
      return buffer;
    }

    // Buffer 3: Plasma Torch Ignition Pop
    function createIgniteBuffer() {
      const sampleRate = audioCtx.sampleRate;
      const duration = 0.15;
      const buffer = audioCtx.createBuffer(1, sampleRate * duration, sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < buffer.length; i++) {
        const t = i / sampleRate;
        const freq = 420 - t * 1800; // Rapid downward frequency sweep
        const env = Math.exp(-t * 28);
        data[i] = Math.sin(2 * Math.PI * Math.max(freq, 40) * t) * env * 0.8;
      }
      return buffer;
    }

    // Buffer 4: Magnetic Metallic Snap (Grabbing Objects)
    function createGrabBuffer() {
      const sampleRate = audioCtx.sampleRate;
      const duration = 0.08;
      const buffer = audioCtx.createBuffer(1, sampleRate * duration, sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < buffer.length; i++) {
        const t = i / sampleRate;
        const env = Math.exp(-t * 60);
        data[i] = ((Math.random() * 2 - 1) * 0.4 + Math.sin(2 * Math.PI * 880 * t) * 0.6) * env;
      }
      return buffer;
    }

    // Buffer 5: Continuous Holographic Table Ambient Hum
    function createHoloHumBuffer() {
      const sampleRate = audioCtx.sampleRate;
      const duration = 2.0;
      const buffer = audioCtx.createBuffer(1, sampleRate * duration, sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < buffer.length; i++) {
        const t = i / sampleRate;
        const hum = Math.sin(2 * Math.PI * 110 * t) * 0.08;
        const harmonic = Math.sin(2 * Math.PI * 220 * t) * 0.03;
        data[i] = hum + harmonic;
      }
      return buffer;
    }

    let bufChime, bufPlasma, bufIgnite, bufGrab, bufHoloHum;
    function initBuffers() {
      bufChime = createChimeBuffer();
      bufPlasma = createPlasmaBuzzBuffer();
      bufIgnite = createIgniteBuffer();
      bufGrab = createGrabBuffer();
      bufHoloHum = createHoloHumBuffer();
    }

    // -------------------------------------------------------------
    // 4. ARCHITECTURE & LAB ENVIRONMENT
    // -------------------------------------------------------------
    const materials = {
      polishedFloor: new THREE.MeshStandardMaterial({ color: 0x111620, roughness: 0.15, metalness: 0.8 }),
      wallConcrete: new THREE.MeshStandardMaterial({ color: 0x1a222e, roughness: 0.8 }),
      brushedMetal: new THREE.MeshStandardMaterial({ color: 0x222a38, metalness: 0.9, roughness: 0.2 }),
      cyanGlow: new THREE.MeshBasicMaterial({ color: 0x00f0ff }),
      glass: new THREE.MeshPhysicalMaterial({ color: 0x88ccff, transparent: true, opacity: 0.35, transmission: 0.8, roughness: 0.1 }),
      cautionStripe: new THREE.MeshStandardMaterial({ color: 0xf59e0b, roughness: 0.5 })
    };

    const floor = new THREE.Mesh(new THREE.BoxGeometry(24, 0.4, 20), materials.polishedFloor);
    floor.position.y = -0.2;
    floor.receiveShadow = true;
    scene.add(floor);

    const floorRing = new THREE.Mesh(
      new THREE.RingGeometry(2.4, 2.45, 64),
      new THREE.MeshBasicMaterial({ color: 0x00f0ff, side: THREE.DoubleSide, transparent: true, opacity: 0.3 })
    );
    floorRing.rotation.x = Math.PI / 2;
    floorRing.position.y = 0.005;
    scene.add(floorRing);

    const backWall = new THREE.Mesh(new THREE.BoxGeometry(24, 6, 0.6), materials.wallConcrete);
    backWall.position.set(0, 3, -8);
    scene.add(backWall);

    for (let x = -8; x <= 8; x += 4) {
      const beam = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.6, 20), materials.brushedMetal);
      beam.position.set(x, 5.7, 0);
      scene.add(beam);
    }

    const ceilingLights = [];
    for (const x of [-8, -4, 0, 4, 8]) {
      for (const z of [-5, 2, 7]) {
        const fixture = new THREE.Mesh(
          new THREE.BoxGeometry(2.5, 0.06, 0.28),
          new THREE.MeshBasicMaterial({ color: 0x8be4fc })
        );
        fixture.position.set(x, 5.35, z);
        scene.add(fixture);

        if (z === 2 && x % 8 === 0) {
          const light = new THREE.PointLight(0x63dfff, 1.8, 10);
          light.position.set(x, 5.05, z);
          scene.add(light);
          ceilingLights.push(light);
        }
      }
    }

    for (const x of [-10.8, 10.8]) {
      const strip = new THREE.Mesh(
        new THREE.BoxGeometry(0.08, 4.8, 0.12),
        new THREE.MeshBasicMaterial({ color: 0x00d2ff })
      );
      strip.position.set(x, 2.7, -1);
      scene.add(strip);
    }

    // -------------------------------------------------------------
    // 4A. PROTOTYPE VEHICLE BAYS
    // -------------------------------------------------------------
    const vehiclePaints = [0x861d2b, 0x183047];
    const vehicleLights = [];

    function createPrototypeCar(paintColor, position, bayLabel) {
      const car = new THREE.Group();
      car.position.copy(position);

      const paint = new THREE.MeshStandardMaterial({
        color: paintColor,
        metalness: 0.72,
        roughness: 0.24,
        clearcoat: 1,
        clearcoatRoughness: 0.12
      });
      const darkGlass = new THREE.MeshPhysicalMaterial({
        color: 0x162b38,
        metalness: 0.35,
        roughness: 0.08,
        transmission: 0.35,
        transparent: true,
        opacity: 0.96,
        clearcoat: 1
      });
      const tire = new THREE.MeshStandardMaterial({ color: 0x101215, roughness: 0.78 });
      const alloy = new THREE.MeshStandardMaterial({ color: 0x9ba9b4, metalness: 0.94, roughness: 0.2 });
      const chrome = new THREE.MeshStandardMaterial({ color: 0x657783, metalness: 0.92, roughness: 0.22 });
      const headlampMaterial = new THREE.MeshPhysicalMaterial({
        color: 0xdaf7ff,
        emissive: 0x5dcfff,
        emissiveIntensity: 1.4,
        roughness: 0.12
      });
      const rearLampMaterial = new THREE.MeshBasicMaterial({ color: 0xff173e });

      const bay = new THREE.Mesh(
        new THREE.BoxGeometry(3.2, 0.035, 5.8),
        new THREE.MeshStandardMaterial({ color: 0x101c2a, metalness: 0.45, roughness: 0.55 })
      );
      bay.position.y = 0.02;
      bay.receiveShadow = true;
      car.add(bay);

      function addLoft(stations, material, segments = 32) {
        const vertices = [];
        const indices = [];
        const steps = (stations.length - 1) * 8;
        function interpolate(key, index, t) {
          const before = stations[Math.max(index - 1, 0)][key];
          const start = stations[index][key];
          const end = stations[index + 1][key];
          const after = stations[Math.min(index + 2, stations.length - 1)][key];
          const t2 = t * t;
          const t3 = t2 * t;
          return 0.5 * (
            2 * start +
            (-before + end) * t +
            (2 * before - 5 * start + 4 * end - after) * t2 +
            (-before + 3 * start - 3 * end + after) * t3
          );
        }

        for (let step = 0; step <= steps; step++) {
          const along = (step / steps) * (stations.length - 1);
          const index = Math.min(Math.floor(along), stations.length - 2);
          const t = along - index;
          const z = THREE.MathUtils.lerp(stations[index].z, stations[index + 1].z, t);
          const width = interpolate('width', index, t);
          const lower = interpolate('lower', index, t);
          const upper = interpolate('upper', index, t);
          for (let segment = 0; segment <= segments; segment++) {
            const angle = (segment / segments) * Math.PI * 2;
            vertices.push(
              Math.cos(angle) * width,
              (lower + upper) * 0.5 + Math.sin(angle) * (upper - lower) * 0.5,
              z
            );
          }
        }
        for (let step = 0; step < steps; step++) {
          for (let segment = 0; segment < segments; segment++) {
            const a = step * (segments + 1) + segment;
            const b = a + segments + 1;
            indices.push(a, a + 1, b, b, a + 1, b + 1);
          }
        }
        const geometry = new THREE.BufferGeometry();
        geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
        geometry.setIndex(indices);
        geometry.computeVertexNormals();
        const mesh = new THREE.Mesh(geometry, material);
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        car.add(mesh);
        return mesh;
      }

      addLoft([
        { z: -2.52, width: 0.5, lower: 0.43, upper: 0.66 },
        { z: -2.28, width: 0.77, lower: 0.35, upper: 0.76 },
        { z: -1.75, width: 0.9, lower: 0.31, upper: 0.84 },
        { z: -1.2, width: 0.94, lower: 0.3, upper: 0.87 },
        { z: -0.5, width: 0.93, lower: 0.3, upper: 0.84 },
        { z: 0.55, width: 0.94, lower: 0.3, upper: 0.85 },
        { z: 1.35, width: 0.92, lower: 0.31, upper: 0.87 },
        { z: 2.1, width: 0.8, lower: 0.35, upper: 0.76 },
        { z: 2.48, width: 0.52, lower: 0.43, upper: 0.64 }
      ], paint);

      addLoft([
        { z: -1.18, width: 0.69, lower: 0.78, upper: 0.82 },
        { z: -0.88, width: 0.69, lower: 0.81, upper: 1.13 },
        { z: -0.42, width: 0.65, lower: 0.82, upper: 1.43 },
        { z: 0.18, width: 0.62, lower: 0.82, upper: 1.48 },
        { z: 0.72, width: 0.64, lower: 0.82, upper: 1.34 },
        { z: 1.12, width: 0.69, lower: 0.79, upper: 0.91 }
      ], darkGlass, 24);

      for (const side of [-1, 1]) {
        const windowTrim = new THREE.Mesh(
          new THREE.TorusGeometry(0.48, 0.018, 8, 36, Math.PI),
          chrome
        );
        windowTrim.rotation.z = Math.PI / 2;
        windowTrim.rotation.y = side * 0.08;
        windowTrim.position.set(side * 0.69, 0.96, -0.03);
        car.add(windowTrim);

        for (const z of [-1.42, 1.42]) {
          const wheelArch = new THREE.Mesh(
            new THREE.TorusGeometry(0.39, 0.045, 10, 40, Math.PI),
            paint
          );
          wheelArch.rotation.y = Math.PI / 2;
          wheelArch.position.set(side * 0.89, 0.38, z);
          car.add(wheelArch);

          const wheel = new THREE.Mesh(new THREE.TorusGeometry(0.3, 0.095, 12, 32), tire);
          wheel.rotation.y = Math.PI / 2;
          wheel.position.set(side * 0.91, 0.38, z);
          wheel.castShadow = true;
          car.add(wheel);

          const rim = new THREE.Mesh(new THREE.CylinderGeometry(0.235, 0.235, 0.12, 32), alloy);
          rim.rotation.z = Math.PI / 2;
          rim.position.set(side * 0.91, 0.38, z);
          car.add(rim);

          const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.075, 0.075, 0.14, 20), chrome);
          hub.rotation.z = Math.PI / 2;
          hub.position.set(side * 0.91, 0.38, z);
          car.add(hub);

          for (let spoke = 0; spoke < 10; spoke++) {
            const angle = (spoke / 10) * Math.PI * 2;
            const spokeMesh = new THREE.Mesh(new THREE.BoxGeometry(0.025, 0.18, 0.035), chrome);
            spokeMesh.position.set(
              side * 0.98,
              0.38 + Math.sin(angle) * 0.13,
              z + Math.cos(angle) * 0.13
            );
            spokeMesh.rotation.x = -angle;
            car.add(spokeMesh);
          }
        }

        const mirror = new THREE.Mesh(new THREE.SphereGeometry(0.09, 16, 12), paint);
        mirror.scale.set(0.7, 0.55, 1.2);
        mirror.position.set(side * 0.89, 0.95, -0.85);
        car.add(mirror);
      }

      for (const x of [-0.62, 0.62]) {
        const headlamp = new THREE.Mesh(new THREE.SphereGeometry(0.14, 20, 12), headlampMaterial);
        headlamp.scale.set(1.35, 0.45, 0.18);
        headlamp.position.set(x, 0.67, -2.27);
        car.add(headlamp);

        const tailLamp = new THREE.Mesh(new THREE.SphereGeometry(0.13, 20, 12), rearLampMaterial);
        tailLamp.scale.set(1.4, 0.45, 0.18);
        tailLamp.position.set(x, 0.68, 2.24);
        car.add(tailLamp);
      }

      const frontGrille = new THREE.Mesh(new THREE.CylinderGeometry(0.13, 0.13, 0.025, 24), chrome);
      frontGrille.rotation.x = Math.PI / 2;
      frontGrille.position.set(0, 0.51, -2.45);
      car.add(frontGrille);

      const splitter = new THREE.Mesh(new THREE.BoxGeometry(1.3, 0.045, 0.22), chrome);
      splitter.position.set(0, 0.34, -2.28);
      car.add(splitter);

      const rearDiffuser = new THREE.Mesh(new THREE.BoxGeometry(1.1, 0.06, 0.18), chrome);
      rearDiffuser.position.set(0, 0.35, 2.32);
      car.add(rearDiffuser);

      const sill = new THREE.Mesh(
        new THREE.BoxGeometry(1.42, 0.045, 0.08),
        new THREE.MeshStandardMaterial({ color: 0x687783, metalness: 0.9, roughness: 0.3 })
      );
      for (const side of [-1, 1]) {
        const sideSill = sill.clone();
        sideSill.position.set(side * 0.82, 0.38, 0);
        car.add(sideSill);
      }

      const bayLight = new THREE.PointLight(0x00cfff, 2.4, 5);
      bayLight.position.set(0, 1.1, 0);
      car.add(bayLight);
      vehicleLights.push(bayLight);

      const spot = new THREE.SpotLight(0x8be4fc, 18, 13, Math.PI / 5, 0.65, 1.4);
      spot.position.set(position.x, 5.1, position.z - 0.5);
      spot.target.position.copy(position).add(new THREE.Vector3(0, 0.2, 0));
      scene.add(spot, spot.target);

      const labelCanvas = document.createElement('canvas');
      labelCanvas.width = 512;
      labelCanvas.height = 96;
      const labelContext = labelCanvas.getContext('2d');
      labelContext.fillStyle = 'rgba(4, 12, 22, 0.9)';
      labelContext.fillRect(0, 0, labelCanvas.width, labelCanvas.height);
      labelContext.strokeStyle = '#00d2ff';
      labelContext.strokeRect(3, 3, labelCanvas.width - 6, labelCanvas.height - 6);
      labelContext.fillStyle = '#8be4fc';
      labelContext.font = 'bold 34px monospace';
      labelContext.textAlign = 'center';
      labelContext.textBaseline = 'middle';
      labelContext.fillText(bayLabel, labelCanvas.width / 2, labelCanvas.height / 2);

      const label = new THREE.Mesh(
        new THREE.PlaneGeometry(1.6, 0.3),
        new THREE.MeshBasicMaterial({
          map: new THREE.CanvasTexture(labelCanvas),
          transparent: true,
          side: THREE.DoubleSide
        })
      );
      label.rotation.x = -Math.PI / 2;
      label.position.set(0, 0.055, -2.65);
      car.add(label);

      scene.add(car);
    }

    createPrototypeCar(vehiclePaints[0], new THREE.Vector3(-7.2, 0, -1.2), "MARK II // ROADSTER");
    createPrototypeCar(vehiclePaints[1], new THREE.Vector3(7.2, 0, -1.2), "MARK III // GT");

    // -------------------------------------------------------------
    // 5. HALL OF ARMOR PODS
    // -------------------------------------------------------------
    for (let i = 0; i < 4; i++) {
      const podGroup = new THREE.Group();
      podGroup.position.set((i - 1.5) * 3.2, 0, -7.2);

      const podFrame = new THREE.Mesh(new THREE.BoxGeometry(2.2, 4.0, 1.4), materials.brushedMetal);
      podFrame.position.y = 2.0;
      const podGlass = new THREE.Mesh(new THREE.BoxGeometry(2.0, 3.8, 0.05), materials.glass);
      podGlass.position.set(0, 2.0, 0.7);

      const podBase = new THREE.Mesh(new THREE.CylinderGeometry(0.8, 0.9, 0.2, 32), materials.brushedMetal);
      podBase.position.y = 0.1;

      const uplight = new THREE.PointLight(0x00d2ff, 1.2, 4);
      uplight.position.set(0, 0.4, 0);

      const dummyArmor = new THREE.Group();

      activeHoloGrips.clear();

      if (!imageHolo) return;
      scene.remove(imageHolo);
      imageHolo.traverse((object) => {
        if (!object.isMesh && !object.isLineSegments) return;
        object.geometry.dispose();
        const materialsToDispose = Array.isArray(object.material) ? object.material : [object.material];
        materialsToDispose.forEach((material) => {
          if (material.map) material.map.dispose();
          material.dispose();

      imageHolo = null;

        URL.revokeObjectURL(objectUrl);
        disposeImageHolo();

        const texture = new THREE.Texture(image);
        texture.colorSpace = THREE.SRGBColorSpace;
        texture.needsUpdate = true;
        const fitScale = Math.min(1.25 / image.width, 1.3 / image.height);
        const width = image.width * fitScale;
        const height = image.height * fitScale;
        const imageGroup = new THREE.Group();
        imageGroup.position.set(0, 1.85, 0);

        const frame = new THREE.LineSegments(
          new THREE.EdgesGeometry(new THREE.BoxGeometry(width + 0.08, height + 0.08, 0.015)),

        );

        if (torchIgniteAudio.isPlaying) torchIgniteAudio.stop();
        torchIgniteAudio.setBuffer(bufIgnite);
        torchIgniteAudio.play();

        // Start looping plasma hum
        if (!torchBuzzAudio.isPlaying) {
          torchBuzzAudio.setBuffer(bufPlasma);
          torchBuzzAudio.play();
        }
      },
      onTriggerEnd: () => {
        toolGroup.userData.isFiring = false;
        beam.visible = false;
        beamLight.intensity = 0;

        // Stop continuous plasma buzz
        if (torchBuzzAudio.isPlaying) {
          torchBuzzAudio.stop();
        }
      }
    };
    grabbables.push(toolGroup);
    scene.add(toolGroup);

    // -------------------------------------------------------------
    // 11. CONTROLLER 3D GRAB SOUNDS
    // -------------------------------------------------------------
    const grabAudio0 = new THREE.PositionalAudio(audioListener);
    const grabAudio1 = new THREE.PositionalAudio(audioListener);
    grabAudio0.setRefDistance(0.5);
    grabAudio1.setRefDistance(0.5);

    // -------------------------------------------------------------
    // 12. J.A.R.V.I.S. HUD BILLBOARD & SPEECH ENGINE
    // -------------------------------------------------------------
    const hudCanvas = document.createElement('canvas');
    hudCanvas.width = 512;
    hudCanvas.height = 256;
    const hudCtx = hudCanvas.getContext('2d');
    const hudTexture = new THREE.CanvasTexture(hudCanvas);

    const hudPlane = new THREE.Mesh(
      new THREE.PlaneGeometry(0.7, 0.35),
      new THREE.MeshBasicMaterial({ map: hudTexture, transparent: true, side: THREE.DoubleSide })
    );
    hudPlane.position.set(0, 1.95, -0.2);
    scene.add(hudPlane);

    function updateJarvisHUD(mainText, subText = "J.A.R.V.I.S. // ONLINE") {
      hudCtx.clearRect(0, 0, 512, 256);
      hudCtx.strokeStyle = 'rgba(0, 240, 255, 0.6)';
      hudCtx.lineWidth = 4;
      hudCtx.strokeRect(10, 10, 492, 236);

      hudCtx.fillStyle = '#00f0ff';
      hudCtx.font = 'bold 24px monospace';
      hudCtx.fillText(subText, 25, 48);

      hudCtx.fillStyle = '#ffffff';
      hudCtx.font = 'bold 26px sans-serif';
      hudCtx.fillText(mainText, 25, 120);

      hudCtx.fillStyle = 'rgba(0, 240, 255, 0.7)';
      for (let i = 0; i < 20; i++) {
        const h = Math.random() * 30 + 5;
        hudCtx.fillRect(25 + i * 23, 180 - h / 2, 14, h);
      }
      hudTexture.needsUpdate = true;
    }
    updateJarvisHUD("Awaiting voice command, sir.");

    let isExploded = false;
    function jarvisSpeak(phrase) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(phrase);
      const voices = window.speechSynthesis.getVoices();
      const british = voices.find(v => v.lang.includes('en-GB') || v.name.includes('UK') || v.name.includes('George'));
      if (british) utterance.voice = british;
      utterance.pitch = 0.95;
      utterance.rate = 1.0;
      window.speechSynthesis.speak(utterance);
      updateJarvisHUD(phrase, "J.A.R.V.I.S. // RESPONDING");
    }

    function handleJarvisCommand(rawTranscript) {
      const text = rawTranscript.toLowerCase().trim();
      updateJarvisHUD(`"${text}"`, "TRANSCRIPT RECEIVED");

      if (text.includes("explode") || text.includes("disassemble")) {
        isExploded = true;
        jarvisSpeak("Expanding armor telemetry, sir.");
      } else if (text.includes("assemble") || text.includes("put back")) {
        isExploded = false;
        jarvisSpeak("Reassembling components.");
      } else if (text.includes("red") || text.includes("gold")) {
        applyHoloColor(0xff3b30);
        jarvisSpeak("Applying hot-rod crimson palette.");
      } else if (text.includes("blue") || text.includes("cyan")) {
        applyHoloColor(0x00f0ff);
        jarvisSpeak("Restoring Stark cyan.");
      } else if (text.includes("green")) {
        applyHoloColor(0x30d158);
        jarvisSpeak("Switching to diagnostic green.");
      } else if (text.includes("wave")) {
        armorMotion = "wave";
        jarvisSpeak("Arm articulation online. Waving hello.");
      } else if (text.includes("walk")) {
        armorMotion = "walk";
        jarvisSpeak("Walking motion engaged.");
      } else if (text.includes("pose")) {
        armorMotion = "pose";
        jarvisSpeak("Setting the armor display pose.");
      } else if (text.includes("stand") || text.includes("neutral") || text.includes("stop")) {
        armorMotion = "idle";
        jarvisSpeak("Returning to neutral stance.");
      } else if (text.includes("status") || text.includes("hello")) {
        jarvisSpeak("Workshop systems online. Say wave, pose, walk, or neutral to articulate the armor.");
      }
    }

    function applyHoloColor(hex) {
      holoLight.color.setHex(hex);
      emitterRing.material.color.setHex(hex);
      [arcCoreMat, armorSurfaceMat, armorDetailMat].forEach(m => {
        m.color.setHex(hex);
        m.emissive.setHex(hex);
      });
      armorLineMat.color.setHex(hex);
      suitCoreMat.color.setHex(hex);
      ring1.material.color.setHex(hex);
      ring2.material.color.setHex(hex);
    }

    function initSpeechEngine() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) return;
      const recognition = new SpeechRecognition();
      recognition.continuous = true;
      recognition.interimResults = false;
      recognition.lang = 'en-US';
      recognition.onresult = (event) => {
        const lastResult = event.results[event.results.length - 1];
        if (lastResult.isFinal) handleJarvisCommand(lastResult[0].transcript);
      };
      recognition.onend = () => { try { recognition.start(); } catch (_) {} };
      try { recognition.start(); } catch (_) {}
    }

    // -------------------------------------------------------------
    // 13. WEBXR CONTROLLERS, 3D GRAB & TRIGGER INTERACTIONS
    // -------------------------------------------------------------
    const controllerFactory = new XRControllerModelFactory();
    const c0 = renderer.xr.getController(0);
    const c1 = renderer.xr.getController(1);
    const cGrip0 = renderer.xr.getControllerGrip(0);
    const cGrip1 = renderer.xr.getControllerGrip(1);

    cGrip0.add(controllerFactory.createControllerModel(cGrip0));
    cGrip1.add(controllerFactory.createControllerModel(cGrip1));
    cGrip0.add(grabAudio0);
    cGrip1.add(grabAudio1);
    cameraRig.add(c0, c1, cGrip0, cGrip1);

    const laserGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, 0, 0), new THREE.Vector3(0, 0, -2)]);
    const laserMat = new THREE.LineBasicMaterial({ color: 0x00f0ff, transparent: true, opacity: 0.4 });
    c0.add(new THREE.Line(laserGeo, laserMat));
    c1.add(new THREE.Line(laserGeo, laserMat));

    const activeHoloGrips = new Map();
    let holoGesture = null;

    function resetHoloGesture() {
      const grips = [...activeHoloGrips.keys()];
      if (grips.length === 0) {
        holoGesture = null;
        return;
      }

      const first = new THREE.Vector3();
      grips[0].getWorldPosition(first);
      const target = activeHoloGrips.get(grips[0]);
      if (grips.length === 1) {
        holoGesture = { target, previousCenter: first };
        return;
      }

      const second = new THREE.Vector3();
      grips[1].getWorldPosition(second);
      const span = second.clone().sub(first);
      holoGesture = {
        target,
        previousCenter: first.clone().add(second).multiplyScalar(0.5),
        previousDistance: Math.max(span.length(), 0.01),
        previousAngle: Math.atan2(span.x, span.z)
      };
    }

    function startHoloManipulation(controller, grip, grabAudio, gripPos) {
      const target = activeHoloGrips.size > 0
        ? activeHoloGrips.values().next().value
        : activeHologram;
      if (!target?.visible) return false;

      const targetPos = new THREE.Vector3();
      target.getWorldPosition(targetPos);
      const reach = activeHoloGrips.size > 0 ? 1.1 : 0.75;
      if (gripPos.distanceTo(targetPos) > reach) return false;

      activeHoloGrips.set(grip, target);
      controller.userData.holoGrip = grip;
      resetHoloGesture();
      if (grabAudio.isPlaying) grabAudio.stop();
      grabAudio.setBuffer(bufGrab);
      grabAudio.play();
      holoStatus.textContent = activeHoloGrips.size === 1
        ? 'Hologram selected. Move one hand to reposition; squeeze with the other hand to resize and rotate.'
        : 'Two hands locked. Move them apart or together to resize; twist them to rotate.';
      return true;
    }

    function updateHoloManipulation() {
      if (!holoGesture) return;
      const grips = [...activeHoloGrips.keys()];
      const target = holoGesture.target;

      if (grips.length === 1) {
        const position = new THREE.Vector3();
        grips[0].getWorldPosition(position);
        target.position.add(position.clone().sub(holoGesture.previousCenter));
        holoGesture.previousCenter.copy(position);
        return;
      }

      const first = new THREE.Vector3();
      const second = new THREE.Vector3();
      grips[0].getWorldPosition(first);
      grips[1].getWorldPosition(second);
      const span = second.clone().sub(first);
      const distance = Math.max(span.length(), 0.01);
      const center = first.clone().add(second).multiplyScalar(0.5);
      target.position.add(center.clone().sub(holoGesture.previousCenter));

      const scale = THREE.MathUtils.clamp(
        target.scale.x * distance / holoGesture.previousDistance,
        0.2,
        1.8
      );
      target.scale.setScalar(scale);
      const angle = Math.atan2(span.x, span.z);
      target.rotation.y += THREE.MathUtils.euclideanModulo(
        angle - holoGesture.previousAngle + Math.PI,
        Math.PI * 2
      ) - Math.PI;

      holoGesture.previousCenter.copy(center);
      holoGesture.previousDistance = distance;
      holoGesture.previousAngle = angle;
    }

    function onGrabStart(event) {
      const controller = event.target;
      const grip = (controller === c0) ? cGrip0 : cGrip1;
      const grabAudio = (controller === c0) ? grabAudio0 : grabAudio1;
      const gripPos = new THREE.Vector3();
      grip.getWorldPosition(gripPos);

      if (startHoloManipulation(controller, grip, grabAudio, gripPos)) return;

      let closest = null;
      let minDist = 0.28;

      for (const obj of grabbables) {
        if (obj.userData.heldBy) continue;
        const objPos = new THREE.Vector3();
        obj.getWorldPosition(objPos);
        const dist = gripPos.distanceTo(objPos);
        if (dist < minDist) {
          minDist = dist;
          closest = obj;
        }
      }

      if (closest) {
        grip.attach(closest);
        closest.userData.heldBy = grip;
        controller.userData.heldObject = closest;

        // Play 3D magnetic snap sound directly on the controller
        if (grabAudio.isPlaying) grabAudio.stop();
        grabAudio.setBuffer(bufGrab);
        grabAudio.play();
      }
    }

    function onGrabEnd(event) {
      const controller = event.target;
      if (controller.userData.holoGrip) {
        activeHoloGrips.delete(controller.userData.holoGrip);
        delete controller.userData.holoGrip;
        resetHoloGesture();
        holoStatus.textContent = 'Hologram released. Squeeze near it again to move, resize, or rotate.';
        return;
      }

      const held = controller.userData.heldObject;
      if (held) {
        // If holding firing torch, kill audio on drop
        if (held.userData.onTriggerEnd && held.userData.isFiring) {
          held.userData.onTriggerEnd();
        }
        scene.attach(held);
        held.userData.heldBy = null;
        controller.userData.heldObject = null;
      }
    }

    function onTriggerStart(event) {
      const controller = event.target;
      const held = controller.userData.heldObject;

      if (held) {
        if (held.userData.onTrigger) held.userData.onTrigger();
        if (held.userData.onTriggerStart) held.userData.onTriggerStart();
      } else {
        isExploded = !isExploded;
        jarvisSpeak(isExploded ? "Exploding schematics." : "Reassembling components.");
      }
    }

    function onTriggerEnd(event) {
      const controller = event.target;
      const held = controller.userData.heldObject;
      if (held && held.userData.onTriggerEnd) {
        held.userData.onTriggerEnd();
      }
    }

    [c0, c1].forEach(c => {
      c.addEventListener('squeezestart', onGrabStart);
      c.addEventListener('squeezeend', onGrabEnd);
      c.addEventListener('selectstart', onTriggerStart);
      c.addEventListener('selectend', onTriggerEnd);
    });

    // -------------------------------------------------------------
    // 14. LOCOMOTION ENGINE (Thumbsticks)
    // -------------------------------------------------------------
    const clock = new THREE.Clock();
    let snapCooldown = 0;

    function handleLocomotion(delta) {
      const session = renderer.xr.getSession();
      if (!session) return;

      for (const source of session.inputSources) {
        if (!source.gamepad) continue;
        const axes = source.gamepad.axes;
        const x = Math.abs(axes[2]) > 0.05 ? axes[2] : (Math.abs(axes[0]) > 0.05 ? axes[0] : 0);
        const y = Math.abs(axes[3]) > 0.05 ? axes[3] : (Math.abs(axes[1]) > 0.05 ? axes[1] : 0);

        if (source.handedness === 'left' && (Math.abs(x) > 0.15 || Math.abs(y) > 0.15)) {
          const forward = new THREE.Vector3();
          camera.getWorldDirection(forward);
          forward.y = 0;
          forward.normalize();
          const right = new THREE.Vector3().crossVectors(camera.up, forward).negate().normalize();

          cameraRig.position.addScaledVector(forward, -y * 3.0 * delta);
          cameraRig.position.addScaledVector(right, x * 3.0 * delta);
        }

        if (source.handedness === 'right' && snapCooldown <= 0) {
          if (x > 0.6) {
            cameraRig.rotation.y -= Math.PI / 4;
            snapCooldown = 0.3;
          } else if (x < -0.6) {
            cameraRig.rotation.y += Math.PI / 4;
            snapCooldown = 0.3;
          }
        }
      }
      if (snapCooldown > 0) snapCooldown -= delta;
    }

    // -------------------------------------------------------------
    // 15. MAIN RENDER LOOP & AUDIO LISTENER SYNC
    // -------------------------------------------------------------
    let explodeLerp = 0;

    renderer.setAnimationLoop((timestamp) => {
      const delta = clock.getDelta();
      const time = timestamp * 0.001;

      handleLocomotion(delta);

      // Holo rotation
      arcCore.rotation.y = time * 0.9;
      ring1.rotation.z = time * 0.3;
      ring2.rotation.z = -time * 0.25;

      const targetLerp = isExploded ? 1.0 : 0.0;
      explodeLerp += (targetLerp - explodeLerp) * 0.08;

      helmetGroup.position.y = 0.57 + explodeLerp * 0.35;
      ring1.position.y = 0.12 - explodeLerp * 0.2;
      ring2.position.y = 0.12 + explodeLerp * 0.45;
      arcCore.scale.setScalar(1.0 + explodeLerp * 0.4);

      torsoGroup.rotation.z = armorMotion === "pose" ? 0.08 : Math.sin(time * 1.4) * 0.012;
      for (const arm of articulatedArms) {
        const waving = armorMotion === "wave" && arm.side === 1;
        arm.shoulder.rotation.z = waving
          ? 1.25 + Math.sin(time * 5) * 0.14
          : armorMotion === "pose"
            ? arm.side * 0.52
            : armorMotion === "walk"
              ? Math.sin(time * 5) * 0.22
              : Math.sin(time * 1.2 + arm.side) * 0.025;
        arm.shoulder.rotation.x = armorMotion === "pose" ? -0.12 : 0;
        arm.elbow.rotation.z = waving
          ? -0.85 + Math.sin(time * 5) * 0.24
          : armorMotion === "pose"
            ? -arm.side * 0.2
            : 0.025;
        arm.palm.rotation.z = waving ? Math.sin(time * 5) * 0.22 : 0;
      }
      for (const leg of articulatedLegs) {
        leg.hip.rotation.x = armorMotion === "walk"
          ? Math.sin(time * 5) * 0.34 * leg.side
          : Math.sin(time * 1.2 + leg.side) * 0.012;
        leg.knee.rotation.x = armorMotion === "walk"
          ? Math.max(0, Math.sin(time * 5 + leg.side)) * 0.52
          : 0.015;
        leg.ankle.rotation.x = armorMotion === "walk"
          ? -leg.knee.rotation.x * 0.35
          : 0;
      }

      updateHoloManipulation();

      // Dum-E joint movement
      lowerArm.rotation.z = Math.sin(time * 1.2) * 0.15;
      upperArm.rotation.x = Math.cos(time * 0.8) * 0.2;
      dume.rotation.y = Math.sin(time * 0.5) * 0.3;

      for (let i = 0; i < vehicleLights.length; i++) {
        vehicleLights[i].intensity = 2.1 + Math.sin(time * 1.8 + i) * 0.25;
      }
      for (let i = 0; i < ceilingLights.length; i++) {
        ceilingLights[i].intensity = 1.7 + Math.sin(time * 0.7 + i * 0.4) * 0.08;
      }

      hudPlane.lookAt(camera.position);

      // Plasma torch beam jitter
      if (toolGroup.userData.isFiring) {
        beam.scale.set(
          1.0 + Math.sin(time * 45) * 0.25,
          1.0 + Math.cos(time * 45) * 0.25,
          1.0
        );
      }

      renderer.render(scene, camera);
    });

    // -------------------------------------------------------------
    // 16. INITIALIZATION & AUDIO UNLOCK
    // -------------------------------------------------------------
    document.getElementById('init-btn').addEventListener('click', async () => {
      // Resume Web Audio Context (Satisfies browser autoplay policy)
      if (audioCtx.state === 'suspended') {
        await audioCtx.resume();
      }

      initBuffers();
      initSpeechEngine();

      // Start ambient holotable hum
      tableAudio.setBuffer(bufHoloHum);
      tableAudio.setLoop(true);
      tableAudio.setVolume(0.5);
      tableAudio.play();

      jarvisSpeak("Workshop spatial audio systems active. Welcome home, sir.");
      document.getElementById('launch-overlay').style.display = 'none';
      document.body.appendChild(VRButton.createButton(renderer));
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
