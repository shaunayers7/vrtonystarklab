<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stark Hall of Armor // Laboratory</title>
  <style>
    body {
      margin: 0;
      background-color: #020408;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      color: #00f0ff;
    }
    #init-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      background: rgba(6, 11, 20, 0.96);
      border: 1px solid rgba(0, 240, 255, 0.4);
      padding: 32px 42px;
      border-radius: 12px;
      box-shadow: 0 0 40px rgba(0, 240, 255, 0.25);
      max-width: 520px;
      z-index: 999;
    }
    #init-overlay h1 {
      margin: 0 0 10px;
      font-size: 1.5rem;
      letter-spacing: 3px;
      color: #00f0ff;
    }
    #init-overlay p {
      font-size: 0.9rem;
      color: #8be4fc;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .action-btn {
      background: linear-gradient(135deg, #00d2ff 0%, #0066ff 100%);
      color: #fff;
      border: none;
      padding: 13px 32px;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 2px;
      border-radius: 6px;
      cursor: pointer;
      box-shadow: 0 0 18px rgba(0, 210, 255, 0.5);
      transition: all 0.2s ease;
    }
    .action-btn:hover {
      transform: scale(1.03);
      box-shadow: 0 0 28px rgba(0, 210, 255, 0.8);
    }
    #status-pill {
      margin-top: 15px;
      font-size: 0.8rem;
      color: #38ef7d;
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="init-overlay">
    <h1>STARK INDUSTRIES // HALL OF ARMOR</h1>
    <p>
      Sit comfortably in a stable chair; standing is not required. Use the left thumbstick to move around the lab. Initialize J.A.R.V.I.S., put on your Quest 3, and enter VR.
    </p>
    <button class="action-btn" id="init-btn">INITIALIZE LABORATORY</button>
    <div id="status-pill">Ready to initialize...</div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { VRButton } from 'three/addons/webxr/VRButton.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { XRControllerModelFactory } from 'three/addons/webxr/XRControllerModelFactory.js';
    import { XRHandModelFactory } from 'three/addons/webxr/XRHandModelFactory.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
    import * as SkeletonUtils from 'three/addons/utils/SkeletonUtils.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
    import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

    // -------------------------------------------------------------
    // 1. RENDERER & CINEMATIC PBR TONEMAPPING
    // -------------------------------------------------------------
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x020408);
    scene.fog = new THREE.FogExp2(0x020408, 0.028);

    const renderer = new THREE.WebGLRenderer({ antialias: false });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
    renderer.xr.enabled = true;
    renderer.xr.setReferenceSpaceType('local-floor');
    renderer.xr.setFramebufferScaleFactor(0.85);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.xr.addEventListener('sessionstart', () => {
      renderer.shadowMap.enabled = false;
    });
    renderer.xr.addEventListener('sessionend', () => {
      renderer.shadowMap.enabled = true;
    });
    document.body.appendChild(renderer.domElement);

    // -------------------------------------------------------------
    // 2. SEATED CAMERA RIG & AUDIO LISTENER
    // -------------------------------------------------------------
    const cameraRig = new THREE.Group();
    cameraRig.position.set(0, 0, 1.35); // Ergonomic seated distance to table
    scene.add(cameraRig);

    const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.05, 50);
    cameraRig.add(camera);

    const audioListener = new THREE.AudioListener();
    camera.add(audioListener);
    const audioCtx = audioListener.context;

    // -------------------------------------------------------------
    // 2A. POST-PROCESSING: SUBTLE BLOOM FOR EMISSIVES
    // -------------------------------------------------------------
    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    const bloomPass = new UnrealBloomPass(
      new THREE.Vector2(window.innerWidth, window.innerHeight),
      0.5,   // strength — subtle, only emissives should glow
      0.55,  // radius
      0.72   // luminance threshold — keeps lit surfaces clean
    );
    composer.addPass(bloomPass);
    composer.addPass(new OutputPass());

    // -------------------------------------------------------------
    // 3. ENVIRONMENT LIGHTING & SHADOWS (PBR needs reflections)
    // -------------------------------------------------------------
    const pmrem = new THREE.PMREMGenerator(renderer);
    scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
    pmrem.dispose();

    const hemi = new THREE.HemisphereLight(0x8bdfff, 0x0a0e16, 0.5);
    scene.add(hemi);

    const keyLight = new THREE.DirectionalLight(0xeaf6ff, 1.2);
    keyLight.position.set(-4, 8, 5);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.set(2048, 2048);
    keyLight.shadow.camera.left = -10;
    keyLight.shadow.camera.right = 10;
    keyLight.shadow.camera.top = 10;
    keyLight.shadow.camera.bottom = -10;
    keyLight.shadow.camera.near = 1;
    keyLight.shadow.camera.far = 25;
    keyLight.shadow.bias = -0.0004;
    scene.add(keyLight);

    // -------------------------------------------------------------
    // 4. PBR MATERIALS
    // -------------------------------------------------------------
    const materials = {
      gunmetal: new THREE.MeshStandardMaterial({ color: 0x23272e, metalness: 0.85, roughness: 0.35 }),
      arcWhite: new THREE.MeshBasicMaterial({ color: 0xffffff }),
      glossFloor: new THREE.MeshStandardMaterial({ color: 0x05080f, metalness: 0.85, roughness: 0.08 }),
      alcoveWall: new THREE.MeshStandardMaterial({ color: 0x141a24, metalness: 0.7, roughness: 0.5 }),
      lightPillar: new THREE.MeshBasicMaterial({ color: 0xffffff })
    };

    // -------------------------------------------------------------
    // 5. HALL OF ARMOR: CURVED BACK WALL WITH 7 ALCOVES
    // -------------------------------------------------------------
    const ALCOVE_COUNT = 7;
    const ARC_RADIUS = 6.2;
    const ARC_SPREAD = 0.9;
    const alcoveCenters = [];

    const floor = new THREE.Mesh(new THREE.CylinderGeometry(14, 14, 0.4, 48), materials.glossFloor);
    floor.position.y = -0.2;
    floor.receiveShadow = true;
    scene.add(floor);

    const canopyCurve = new THREE.Mesh(
      new THREE.TorusGeometry(ARC_RADIUS, 0.25, 12, 48, ARC_SPREAD),
      materials.gunmetal
    );
    canopyCurve.rotation.x = Math.PI / 2;
    canopyCurve.rotation.z = Math.PI / 2 - ARC_SPREAD / 2;
    canopyCurve.position.set(0, 3.4, -1.8);
    scene.add(canopyCurve);

    for (let i = 0; i < ALCOVE_COUNT; i++) {
      const t = (i / (ALCOVE_COUNT - 1)) - 0.5;
      const angle = t * ARC_SPREAD;
      const x = Math.sin(angle) * ARC_RADIUS;
      const z = -Math.cos(angle) * ARC_RADIUS + 2.5;

      const alcoveGroup = new THREE.Group();
      alcoveGroup.position.set(x, 0, z);
      alcoveGroup.rotation.y = angle;

      // Alcove interior sized snug around a ~2.0m suit
      const backPlate = new THREE.Mesh(new THREE.BoxGeometry(1.25, 2.7, 0.1), materials.alcoveWall);
      backPlate.position.set(0, 1.35, -0.55);
      alcoveGroup.add(backPlate);

      for (let y = 0.25; y < 2.55; y += 0.25) {
        const louver = new THREE.Mesh(new THREE.BoxGeometry(1.05, 0.035, 0.07), materials.gunmetal);
        louver.position.set(0, y, -0.49);
        alcoveGroup.add(louver);
      }

      const leftPillar = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.035, 2.7, 16), materials.lightPillar);
      leftPillar.position.set(-0.62, 1.35, 0);
      const rightPillar = leftPillar.clone();
      rightPillar.position.x = 0.62;
      alcoveGroup.add(leftPillar, rightPillar);

      const basePlatform = new THREE.Mesh(new THREE.BoxGeometry(1.05, 0.12, 0.85), materials.gunmetal);
      basePlatform.position.set(0, 0.06, 0);
      basePlatform.receiveShadow = true;
      alcoveGroup.add(basePlatform);

      const spotLight = new THREE.SpotLight(0xffeaad, 3.5, 7.5, Math.PI / 6, 0.4, 1.2);
      spotLight.position.set(0, 3.3, 0.2);
      spotLight.target.position.set(0, 1.0, 0);
      alcoveGroup.add(spotLight);
      alcoveGroup.add(spotLight.target);

      const uplight = new THREE.PointLight(0xffffff, 0.6, 2.5);
      uplight.position.set(0, 0.3, 0.2);
      alcoveGroup.add(uplight);

      scene.add(alcoveGroup);
      alcoveCenters.push({ group: alcoveGroup, position: new THREE.Vector3(x, 0.12, z), rotation: angle });
    }

    // -------------------------------------------------------------
    // 6. SEGMENTED ARMOR CREATOR (Holographic fallback for the workbench rig)
    // -------------------------------------------------------------
    function createSegmentedArmor(isHologram = false, palette = { crimson: 0x9b111e, gold: 0xd4af37 }) {
      const root = new THREE.Group();

      let matCrimson = new THREE.MeshStandardMaterial({ color: palette.crimson, metalness: 0.92, roughness: 0.18 });
      let matGold = new THREE.MeshStandardMaterial({ color: palette.gold, metalness: 0.95, roughness: 0.22 });
      let matCore = materials.arcWhite;

      if (isHologram) {
        const holoMat = (colorHex, op = 0.7) => new THREE.MeshStandardMaterial({
          color: colorHex,
          emissive: colorHex,
          emissiveIntensity: 0.65,
          roughness: 0.1,
          metalness: 0.9,
          transparent: true,
          opacity: op
        });
        matCrimson = holoMat(0x00f0ff, 0.65);
        matGold = holoMat(0xffd700, 0.75);
        matCore = new THREE.MeshBasicMaterial({ color: 0xffffff });
      }

      // Helmet
      const helmetGroup = new THREE.Group();
      helmetGroup.position.set(0, 1.62, 0);

      const skull = new THREE.Mesh(new THREE.SphereGeometry(0.12, 24, 24), matCrimson);
      skull.scale.set(0.9, 1.05, 1.0);
      helmetGroup.add(skull);

      const jawL = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.09, 0.14), matGold);
      jawL.position.set(-0.075, -0.04, 0.04);
      jawL.rotation.y = 0.2;
      const jawR = jawL.clone();
      jawR.position.x = 0.075;
      jawR.rotation.y = -0.2;
      helmetGroup.add(jawL, jawR);

      // Actuating Faceplate
      const faceplateGroup = new THREE.Group();
      faceplateGroup.position.set(0, 0.01, 0.08);

      const brow = new THREE.Mesh(new THREE.BoxGeometry(0.13, 0.04, 0.06), matGold);
      brow.position.set(0, 0.045, 0.02);
      brow.rotation.x = -0.2;

      const noseCheeks = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.08, 0.05), matGold);
      noseCheeks.position.set(0, -0.01, 0.03);

      const eyeGeo = new THREE.BoxGeometry(0.035, 0.008, 0.02);
      const eyeL = new THREE.Mesh(eyeGeo, matCore);
      eyeL.position.set(-0.035, 0.025, 0.052);
      eyeL.rotation.z = -0.15;
      const eyeR = new THREE.Mesh(eyeGeo, matCore);
      eyeR.position.set(0.035, 0.025, 0.052);
      eyeR.rotation.z = 0.15;

      faceplateGroup.add(brow, noseCheeks, eyeL, eyeR);
      helmetGroup.add(faceplateGroup);
      root.add(helmetGroup);

      // Torso
      const torsoGroup = new THREE.Group();
      torsoGroup.position.set(0, 1.25, 0);

      const upperChest = new THREE.Mesh(new THREE.BoxGeometry(0.38, 0.26, 0.22), matCrimson);
      upperChest.position.set(0, 0.12, 0);

      const reactorRing = new THREE.Mesh(new THREE.RingGeometry(0.035, 0.05, 32), matGold);
      reactorRing.position.set(0, 0.13, 0.135);
      const reactorCore = new THREE.Mesh(new THREE.CircleGeometry(0.032, 32), matCore);
      reactorCore.position.set(0, 0.13, 0.136);

      const abs = new THREE.Mesh(new THREE.BoxGeometry(0.24, 0.22, 0.18), matGold);
      abs.position.set(0, -0.1, 0);

      torsoGroup.add(upperChest, reactorRing, reactorCore, abs);
      root.add(torsoGroup);

      // Arms
      const armL = new THREE.Group();
      armL.position.set(-0.25, 1.35, 0);
      const pauldronL = new THREE.Mesh(new THREE.SphereGeometry(0.09, 16, 16), matCrimson);
      pauldronL.scale.set(1.1, 0.7, 0.9);
      const bicepL = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.04, 0.22, 16), matGold);
      bicepL.position.y = -0.14;
      const gauntletL = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.04, 0.24, 16), matCrimson);
      gauntletL.position.y = -0.34;
      armL.add(pauldronL, bicepL, gauntletL);

      const armR = new THREE.Group();
      armR.position.set(0.25, 1.35, 0);
      const pauldronR = pauldronL.clone();
      const bicepR = bicepL.clone();
      const gauntletR = gauntletL.clone();
      armR.add(pauldronR, bicepR, gauntletR);
      root.add(armL, armR);

      // Legs
      const legL = new THREE.Group();
      legL.position.set(-0.11, 0.9, 0);
      const thighL = new THREE.Mesh(new THREE.CylinderGeometry(0.065, 0.05, 0.36, 16), matCrimson);
      thighL.position.y = -0.16;
      const calfL = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.055, 0.38, 16), matGold);
      calfL.position.y = -0.48;
      const bootL = new THREE.Mesh(new THREE.BoxGeometry(0.11, 0.09, 0.19), matCrimson);
      bootL.position.set(0, -0.71, 0.04);
      legL.add(thighL, calfL, bootL);

      const legR = new THREE.Group();
      legR.position.set(0.11, 0.9, 0);
      const thighR = thighL.clone();
      const calfR = calfL.clone();
      const bootR = bootL.clone();
      legR.add(thighR, calfR, bootR);
      root.add(legL, legR);

      return { root, faceplate: faceplateGroup, helmet: helmetGroup, torso: torsoGroup, armL, armR, legL, legR };
    }

    // Only the two real GLB suits go on display — no procedural placeholders
    const bay3Data = alcoveCenters[3];

    // --- LOAD REAL IRON MAN SUITS (.GLB) ---
    // Both Sketchfab exports are raw Z-up meshes (~1818 units tall, identity
    // transforms), so each gets a corrective wrap: rotate to Y-up, scale to ~1.82m.
    // The hologram falls back to segmented procedural armor if the hero file is missing.
    let holoIsGLB = false;
    const gltfLoader = new GLTFLoader();
    const SUIT_SCALE = 0.0011;

    function wrapSuitModel(model) {
      model.rotation.x = -Math.PI / 2; // Z-up -> Y-up
      model.scale.setScalar(SUIT_SCALE); // 1818 raw units -> ~2.0 m tall
      return model;
    }

    function placeInAlcove(wrapper, bay) {
      wrapper.position.copy(bay.position);
      wrapper.rotation.y = bay.rotation;
      wrapper.traverse((child) => {
        if (child.isMesh) {
          child.castShadow = true;
          child.receiveShadow = true;
        }
      });
      scene.add(wrapper);
    }

    function jarvisIfReady(phrase) {
      // Avoid cancelling the welcome line if models finish loading pre-init
      if (document.getElementById('init-overlay').style.display === 'none') {
        jarvisSpeak(phrase);
      }
    }

    // HERO SUIT — center alcove + holographic clone above the workbench
    gltfLoader.load(
      './iron_man_mk7.glb',
      (gltf) => {
        // 1. PHYSICAL DISPLAY SUIT (Center Alcove Bay)
        const physicalSuit = wrapSuitModel(gltf.scene);
        placeInAlcove(physicalSuit, bay3Data);

        // 2. HOLOGRAPHIC CLONE (Above the workbench)
        const holoClone = SkeletonUtils.clone(physicalSuit);
        holoClone.traverse((child) => {
          if (child.isMesh) {
            child.castShadow = false;
            child.receiveShadow = false;
            child.material = new THREE.MeshStandardMaterial({
              color: 0x00f0ff,
              emissive: 0x00f0ff,
              emissiveIntensity: 0.65,
              roughness: 0.1,
              metalness: 0.9,
              transparent: true,
              opacity: 0.7,
              wireframe: false
            });
          }
        });
        holoClone.position.set(0, 0, 0);
        holoRig.remove(holoSuit.root); // Swap out the segmented hologram
        holoRig.add(holoClone);
        holoIsGLB = true;

        jarvisIfReady("Armor telemetry synced. Mark Seven model online.");
      },
      (progress) => {
        if (progress.total > 0) {
          console.log(`Loading suit: ${(progress.loaded / progress.total * 100).toFixed(0)}%`);
        }
      },
      (error) => {
        console.error("Failed to load iron_man_mk7.glb:", error);
      }
    );

    // SECOND SUIT — alcove right of the hero (bay 5)
    const bay4Data = alcoveCenters[4];
    gltfLoader.load(
      './iron-man-mk7_2suit.glb',
      (gltf) => {
        placeInAlcove(wrapSuitModel(gltf.scene), bay4Data);
        jarvisIfReady("Mark Seven variant secured in bay five.");
      },
      undefined,
      (error) => {
        console.error("Failed to load iron-man-mk7_2suit.glb:", error);
      }
    );

    // DamagedHelmet display piece on a pedestal beside the workbench
    const helmetPedestal = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.13, 0.9, 24), materials.gunmetal);
    helmetPedestal.position.set(1.05, 0.57, 0.55);
    helmetPedestal.castShadow = true;
    scene.add(helmetPedestal);

    const helmetAnchor = new THREE.Group();
    helmetAnchor.position.set(1.05, 1.06, 0.55);
    scene.add(helmetAnchor);

    gltfLoader.load(
      'https://cdn.jsdelivr.net/gh/mrdoob/three.js@dev/examples/models/gltf/DamagedHelmet/glTF-Binary/DamagedHelmet.glb',
      (gltf) => {
        const helmet = gltf.scene;
        helmet.scale.setScalar(0.28);
        helmet.traverse((o) => { if (o.isMesh) o.castShadow = true; });
        helmetAnchor.add(helmet);
      },
      undefined,
      (error) => console.error('Helmet failed to load:', error)
    );

    // -------------------------------------------------------------
    // 7. CENTRAL GANTRY WORKBENCH (0.85m Seated Height) + HUM
    // -------------------------------------------------------------
    const workbenchGroup = new THREE.Group();
    workbenchGroup.position.set(0, 0, 0);

    const gantryBase = new THREE.Mesh(new THREE.CylinderGeometry(1.6, 1.7, 0.12, 48), materials.gunmetal);
    gantryBase.position.y = 0.06;
    gantryBase.receiveShadow = true;
    workbenchGroup.add(gantryBase);

    const holotableTop = new THREE.Mesh(new THREE.CylinderGeometry(0.9, 0.95, 0.08, 32), materials.gunmetal);
    holotableTop.position.y = 0.85;
    workbenchGroup.add(holotableTop);

    const emitterRing = new THREE.Mesh(new THREE.RingGeometry(0.42, 0.46, 32), new THREE.MeshBasicMaterial({ color: 0x00f0ff, side: THREE.DoubleSide }));
    emitterRing.rotation.x = -Math.PI / 2;
    emitterRing.position.y = 0.892;
    workbenchGroup.add(emitterRing);

    const holoLight = new THREE.PointLight(0x00f0ff, 2.8, 3.5);
    holoLight.position.set(0, 1.1, 0);
    workbenchGroup.add(holoLight);

    scene.add(workbenchGroup);

    // -------------------------------------------------------------
    // 8. HOLOGRAPHIC SUIT RIG (Floating at Chest Level)
    // -------------------------------------------------------------
    const holoRig = new THREE.Group();
    let holoBaseY = 0.95;
    holoRig.position.set(0, holoBaseY, 0);
    holoRig.scale.setScalar(0.65);
    scene.add(holoRig);

    const holoSuit = createSegmentedArmor(true);
    holoRig.add(holoSuit.root);

    const gimbalRing1 = new THREE.Mesh(
      new THREE.RingGeometry(0.48, 0.49, 48),
      new THREE.MeshBasicMaterial({ color: 0x00f0ff, side: THREE.DoubleSide, transparent: true, opacity: 0.4 })
    );
    gimbalRing1.rotation.x = Math.PI / 2;
    holoRig.add(gimbalRing1);

    // Positional servo/surge emitter on the hologram
    const servoAudio = new THREE.PositionalAudio(audioListener);
    servoAudio.setRefDistance(1.0);
    servoAudio.setMaxDistance(10);
    servoAudio.setRolloffFactor(1.6);
    holoRig.add(servoAudio);

    // -------------------------------------------------------------
    // 8A. HOLO-FORGE: VOICE-CONTROLLED SHAPE MODELING PAD
    // -------------------------------------------------------------
    const forgeGroup = new THREE.Group();
    forgeGroup.position.set(0.55, 1.05, -0.3);
    scene.add(forgeGroup);

    // Emitter pad glowing on the tabletop beneath the forge hologram
    const forgePad = new THREE.Mesh(
      new THREE.RingGeometry(0.16, 0.19, 32),
      new THREE.MeshBasicMaterial({ color: 0x00f0ff, side: THREE.DoubleSide, transparent: true, opacity: 0.7 })
    );
    forgePad.rotation.x = -Math.PI / 2;
    forgePad.position.y = -0.158; // Rests on the tabletop surface (~0.89)
    forgeGroup.add(forgePad);

    const forgeShapes = [];
    let forgeSpin = false;
    let forgeColor = 0x00f0ff;
    const FORGE_COLORS = { red: 0xff3b30, gold: 0xffd700, blue: 0x00f0ff, cyan: 0x00f0ff, green: 0x30d158, orange: 0xff9500, purple: 0xbf5af2, white: 0xffffff };

    function forgeMaterial(colorHex) {
      return new THREE.MeshStandardMaterial({
        color: colorHex,
        emissive: colorHex,
        emissiveIntensity: 0.7,
        transparent: true,
        opacity: 0.78,
        roughness: 0.2,
        metalness: 0.4
      });
    }

    function addForgeShape(type) {
      let geometry;
      switch (type) {
        case 'cube': case 'box': geometry = new THREE.BoxGeometry(0.22, 0.22, 0.22); break;
        case 'sphere': geometry = new THREE.SphereGeometry(0.14, 24, 18); break;
        case 'cylinder': geometry = new THREE.CylinderGeometry(0.11, 0.11, 0.24, 24); break;
        case 'torus': geometry = new THREE.TorusGeometry(0.12, 0.045, 12, 32); break;
        case 'cone': geometry = new THREE.ConeGeometry(0.13, 0.26, 24); break;
        case 'pyramid': geometry = new THREE.ConeGeometry(0.15, 0.24, 4); break;
        default: return null;
      }
      const mesh = new THREE.Mesh(geometry, forgeMaterial(forgeColor));
      // White schematic edges make it read as a Stark CAD hologram
      const edges = new THREE.LineSegments(
        new THREE.EdgesGeometry(geometry),
        new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.45 })
      );
      mesh.add(edges);
      // Arrange successive shapes in a loose cluster above the pad
      const n = forgeShapes.length;
      mesh.position.set((n % 3 - 1) * 0.26, 0.2 + Math.floor(n / 3) * 0.3, 0);
      forgeGroup.add(mesh);
      forgeShapes.push(mesh);
      playPositional(servoAudio, bufServo);
      return mesh;
    }

    function scaleLastForgeShape(factor) {
      const last = forgeShapes[forgeShapes.length - 1];
      if (!last) { jarvisSpeak("The forge pad is empty, sir. Create a shape first."); return; }
      last.scale.multiplyScalar(factor).clampScalar(0.25, 3);
      jarvisSpeak(factor > 1 ? "Increasing dimensions." : "Reducing dimensions.");
    }

    function toggleForgeWireframe() {
      const last = forgeShapes[forgeShapes.length - 1];
      if (!last) { jarvisSpeak("Nothing on the forge pad to reformat, sir."); return; }
      last.material.wireframe = !last.material.wireframe;
      jarvisSpeak(last.material.wireframe ? "Wireframe schematic view." : "Solid holographic view.");
    }

    function colorLastForgeShape(colorName) {
      const last = forgeShapes[forgeShapes.length - 1];
      const hex = FORGE_COLORS[colorName];
      if (!last || hex === undefined) return false;
      last.material.color.setHex(hex);
      last.material.emissive.setHex(hex);
      forgeColor = hex;
      return true;
    }

    function clearForge() {
      for (const shape of forgeShapes) {
        shape.traverse((o) => {
          if (o.geometry) o.geometry.dispose();
          if (o.material) o.material.dispose();
        });
        forgeGroup.remove(shape);
      }
      forgeShapes.length = 0;
    }

    // -------------------------------------------------------------
    // 9. PROCEDURAL SOUND SYNTHESIS ENGINE (No External MP3s Needed)
    // -------------------------------------------------------------
    function createChimeBuffer() {
      const sampleRate = audioCtx.sampleRate;
      const duration = 0.22;
      const buffer = audioCtx.createBuffer(1, sampleRate * duration, sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < buffer.length; i++) {
        const t = i / sampleRate;
        const env = Math.exp(-t * 22);
        data[i] = (Math.sin(2 * Math.PI * 1174 * t) * 0.6 + Math.sin(2 * Math.PI * 1760 * t) * 0.4) * env;
      }
      return buffer;
    }

    function createSurgeBuffer() {
      const sampleRate = audioCtx.sampleRate;
      const duration = 1.0;
      const buffer = audioCtx.createBuffer(1, sampleRate * duration, sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < buffer.length; i++) {
        const t = i / sampleRate;
        const env = Math.exp(-t * 4);
        const sub = Math.sin(2 * Math.PI * 62 * t) * 0.5;
        const harmonic = Math.sin(2 * Math.PI * 124 * t) * 0.3;
        const hiss = (Math.random() * 2 - 1) * 0.2;
        data[i] = (sub + harmonic + hiss) * 0.6 * env;
      }
      return buffer;
    }

    function createServoBuffer() {
      const sampleRate = audioCtx.sampleRate;
      const duration = 0.15;
      const buffer = audioCtx.createBuffer(1, sampleRate * duration, sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < buffer.length; i++) {
        const t = i / sampleRate;
        const freq = 420 - t * 1800;
        const env = Math.exp(-t * 28);
        data[i] = Math.sin(2 * Math.PI * Math.max(freq, 40) * t) * env * 0.8;
      }
      return buffer;
    }

    function createGrabBuffer() {
      const sampleRate = audioCtx.sampleRate;
      const duration = 0.08;
      const buffer = audioCtx.createBuffer(1, sampleRate * duration, sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < buffer.length; i++) {
        const t = i / sampleRate;
        const env = Math.exp(-t * 60);
        data[i] = ((Math.random() * 2 - 1) * 0.4 + Math.sin(2 * Math.PI * 880 * t) * 0.6) * env;
      }
      return buffer;
    }

    let bufChime, bufSurge, bufServo, bufGrab;
    function initBuffers() {
      bufChime = createChimeBuffer();
      bufSurge = createSurgeBuffer();
      bufServo = createServoBuffer();
      bufGrab = createGrabBuffer();
    }

    function playPositional(audio, buffer) {
      if (!buffer) return;
      if (audio.isPlaying) audio.stop();
      audio.setBuffer(buffer);
      audio.play();
    }

    // -------------------------------------------------------------
    // 13. J.A.R.V.I.S. SPEECH ENGINE
    // -------------------------------------------------------------
    function jarvisSpeak(phrase) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(phrase);
      const voices = window.speechSynthesis.getVoices();
      const british = voices.find(v => v.lang.includes('en-GB') || v.name.includes('UK') || v.name.includes('George'));
      if (british) utterance.voice = british;
      utterance.pitch = 0.95;
      utterance.rate = 1.0;
      window.speechSynthesis.speak(utterance);
    }

    function handleJarvisCommand(rawTranscript) {
      const text = rawTranscript.toLowerCase().trim();

      if (text.includes("exit") || text.includes("quit") || text.includes("power down") || text.includes("close simulation")) {
        exitSimulation();
      } else if (text.includes("mask") || text.includes("faceplate")) {
        if (text.includes("close") || text.includes("shut")) toggleMask(false);
        else toggleMask(true);
      } else if (text.includes("explode") || text.includes("disassemble") || text.includes("expand")) {
        toggleExplode(true);
      } else if (text.includes("assemble") || text.includes("collapse") || text.includes("put back")) {
        toggleExplode(false);
      } else if (text.includes("clear forge")) {
        clearForge();
        jarvisSpeak("Forge pad cleared.");
      } else if (text.includes("forge") || text.includes("create") || text.includes("add a") || text.includes("make a")) {
        const found = ["cube", "box", "sphere", "cylinder", "torus", "cone", "pyramid"].find(t => text.includes(t));
        if (found) {
          addForgeShape(found);
          jarvisSpeak(`Forging ${found === "box" ? "cube" : found} hologram, sir.`);
        } else if (text.includes("bigger") || text.includes("larger")) {
          scaleLastForgeShape(1.25);
        } else if (text.includes("smaller") || text.includes("shrink")) {
          scaleLastForgeShape(0.8);
        } else {
          jarvisSpeak("Specify a shape, sir: cube, sphere, cylinder, torus, cone, or pyramid.");
        }
      } else if (text.includes("shape") && (text.includes("bigger") || text.includes("larger") || text.includes("grow"))) {
        scaleLastForgeShape(1.25);
      } else if (text.includes("shape") && (text.includes("smaller") || text.includes("shrink"))) {
        scaleLastForgeShape(0.8);
      } else if (text.includes("wireframe")) {
        toggleForgeWireframe();
      } else if (text.includes("spin") && (text.includes("shape") || text.includes("forge"))) {
        forgeSpin = !forgeSpin;
        jarvisSpeak(forgeSpin ? "Rotating the forge model." : "Rotation halted.");
      } else if (text.includes("make it") || text.includes("colour") || text.includes("color")) {
        const colorName = Object.keys(FORGE_COLORS).find(c => text.includes(c));
        if (colorName && colorLastForgeShape(colorName)) {
          jarvisSpeak(`Recalibrating forge emission to ${colorName}.`);
        } else if (colorName) {
          jarvisSpeak("The forge pad is empty, sir. Create a shape first.");
        }
      } else if (text.includes("rotate left")) {
        holoRig.rotation.y -= 0.6;
      } else if (text.includes("rotate right")) {
        holoRig.rotation.y += 0.6;
      } else if (text.includes("scale up") || text.includes("bigger")) {
        holoRig.scale.multiplyScalar(1.25).clampScalar(0.25, 1.8);
      } else if (text.includes("scale down") || text.includes("smaller")) {
        holoRig.scale.multiplyScalar(0.8).clampScalar(0.25, 1.8);
      } else if (text.includes("status") || text.includes("hello")) {
        jarvisSpeak("All workshop telemetry and gestural sensors are nominal, sir.");
      }
    }

    function initSpeechEngine() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) return;
      const recognition = new SpeechRecognition();
      recognition.continuous = true;
      recognition.interimResults = false;
      recognition.lang = 'en-US';
      recognition.onresult = (event) => {
        const last = event.results[event.results.length - 1];
        if (last.isFinal) handleJarvisCommand(last[0].transcript);
      };
      recognition.onend = () => { try { recognition.start(); } catch (_) {} };
      try { recognition.start(); } catch (_) {}
    }

    // -------------------------------------------------------------
    // 14. INPUT PIPELINE: HANDS, CONTROLLERS & RAYCASTING
    // -------------------------------------------------------------
    const controllerFactory = new XRControllerModelFactory();
    const handFactory = new XRHandModelFactory();

    cameraRig.add(hand0);

    const hand1 = renderer.xr.getHand(1);
    hand1.add(handFactory.createHandModel(hand1, 'spheres'));
    cameraRig.add(hand1);

    const c0 = renderer.xr.getController(0);
    const c1 = renderer.xr.getController(1);
    const cGrip0 = renderer.xr.getControllerGrip(0);
    const cGrip1 = renderer.xr.getControllerGrip(1);

    cGrip1.add(controllerFactory.createControllerModel(cGrip1));

    // Grab-snap audio emitters on the grips
    const grabAudio0 = new THREE.PositionalAudio(audioListener);
    const grabAudio1 = new THREE.PositionalAudio(audioListener);
    grabAudio0.setRefDistance(0.5);
    grabAudio1.setRefDistance(0.5);
    cGrip0.add(grabAudio0);
    cGrip1.add(grabAudio1);

    const laserGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, 0, 0), new THREE.Vector3(0, 0, -2)]);
    const laserMat = new THREE.LineBasicMaterial({ color: 0x00f0ff, transparent: true, opacity: 0.5 });
    c0.add(new THREE.Line(laserGeo, laserMat));
    c1.add(new THREE.Line(laserGeo, laserMat));

    // Raycaster for clicking terminal buttons
    const raycaster = new THREE.Raycaster();
    const tempMatrix = new THREE.Matrix4();

    // Two-Hand Pinch & Pull tracker
    const grabState = {
      h0Pinching: false,
      h1Pinching: false,
      initialDistance: 0,
      initialScale: 0.65,
      forgeTarget: false
    };

    // One-Hand Grab & Rotate tracker (with tap-vs-drag detection for mask toggle)
    const dragState = {
      active: false,
      controller: null,
      lastPos: new THREE.Vector3(),
      moved: 0,
      startTime: 0,
      startedOnButton: false,
      forgeTarget: false
    };

    function onSelectStart(event) {
      const controller = event.target;
      tempMatrix.identity().extractRotation(controller.matrixWorld);
      raycaster.ray.origin.setFromMatrixPosition(controller.matrixWorld);
      raycaster.ray.direction.set(0, 0, -1).applyMatrix4(tempMatrix);

      // 1. Interactive terminal buttons take priority
      const hits = raycaster.intersectObjects(clickableButtons, false);
      if (hits.length > 0) {
        const hit = hits[0].object;
        if (hit.userData.action) {
          hit.userData.action();
          playPositional(termAudio, bufChime);
          dragState.startedOnButton = true;
          return;
        }
      }

      // 2. Forge pad proximity determines the gesture target
      const forgeWorld = new THREE.Vector3();
      forgeGroup.getWorldPosition(forgeWorld);
      const nearForge = raycaster.ray.origin.distanceTo(forgeWorld) < 0.55;

      // 3. Track pinch state
      if (controller === c0) grabState.h0Pinching = true;
      if (controller === c1) grabState.h1Pinching = true;

      if (grabState.h0Pinching && grabState.h1Pinching) {
        // Two-handed scale: capture baseline
        const p0 = new THREE.Vector3();
        const p1 = new THREE.Vector3();
        c0.getWorldPosition(p0);
        c1.getWorldPosition(p1);
        grabState.initialDistance = p0.distanceTo(p1);
        grabState.forgeTarget = nearForge || dragState.forgeTarget;
        grabState.initialScale = grabState.forgeTarget ? forgeGroup.scale.x : holoRig.scale.x;
        dragState.active = false;
        dragState.controller = null;
      } else {
        // One-handed grab: begin rotate/drag tracking
        dragState.active = true;
        dragState.controller = controller;
        dragState.forgeTarget = nearForge;
        controller.getWorldPosition(dragState.lastPos);
        dragState.moved = 0;
        dragState.startTime = performance.now();
        dragState.startedOnButton = false;
        playPositional(controller === c0 ? grabAudio0 : grabAudio1, bufGrab);
      }
    }

    function onSelectEnd(event) {
      const controller = event.target;
      if (controller === c0) grabState.h0Pinching = false;
      if (controller === c1) grabState.h1Pinching = false;
      if (!grabState.h0Pinching && !grabState.h1Pinching) grabState.forgeTarget = false;

      if (dragState.startedOnButton) {
        dragState.startedOnButton = false;
        return;
      }

      if (dragState.active && dragState.controller === controller) {
        // Quick tap (no drag): forge tap toggles wireframe, otherwise faceplate
        const quickTap = (performance.now() - dragState.startTime) < 300 && dragState.moved < 0.02;
        const wasForge = dragState.forgeTarget;
        dragState.active = false;
        dragState.controller = null;
        dragState.forgeTarget = false;
        if (quickTap) {
          if (wasForge) toggleForgeWireframe();
          else toggleMask();
        }
      }
    }

    // Grip Squeeze toggles Explode view
    function onSqueezeStart(event) {
      playPositional(event.target === c0 ? grabAudio0 : grabAudio1, bufGrab);
      toggleExplode();
    }

    [c0, c1].forEach(c => {
      c.addEventListener('selectstart', onSelectStart);
      c.addEventListener('selectend', onSelectEnd);
      c.addEventListener('squeezestart', onSqueezeStart);
    });

    // -------------------------------------------------------------
    // 15. LOCOMOTION, DRAG-ROTATE & TWO-HAND EXPAND GESTURE
    // -------------------------------------------------------------
    const clock = new THREE.Clock();

    function handleInput(delta) {
      const session = renderer.xr.getSession();

      // One-hand grab: near the forge you move shapes, near the suit you rotate it
      if (dragState.active && dragState.controller && !(grabState.h0Pinching && grabState.h1Pinching)) {
        const pos = new THREE.Vector3();
        dragState.controller.getWorldPosition(pos);
        const dx = pos.x - dragState.lastPos.x;
        const dy = pos.y - dragState.lastPos.y;
        const dz = pos.z - dragState.lastPos.z;
        if (dragState.forgeTarget) {
          forgeGroup.position.x += dx;
          forgeGroup.position.z += dz;
          forgeGroup.position.y = THREE.MathUtils.clamp(forgeGroup.position.y + dy, 1.0, 1.9);
        } else {
          holoRig.rotation.y += dx * 4.0;
          holoBaseY = THREE.MathUtils.clamp(holoBaseY + dy * 0.5, 0.7, 1.6);
        }
        dragState.moved += Math.abs(dx) + Math.abs(dy) + Math.abs(dz);
        dragState.lastPos.copy(pos);
      }

      if (!session) return;

      // Two-Handed Pinch & Pull (scales the forge model or the suit hologram)
      if (grabState.h0Pinching && grabState.h1Pinching && grabState.initialDistance > 0.05) {
        const p0 = new THREE.Vector3();
        const p1 = new THREE.Vector3();
        c0.getWorldPosition(p0);
        c1.getWorldPosition(p1);
        const currentDist = p0.distanceTo(p1);
        const scaleMultiplier = currentDist / grabState.initialDistance;
        if (grabState.forgeTarget) {
          forgeGroup.scale.setScalar(THREE.MathUtils.clamp(grabState.initialScale * scaleMultiplier, 0.4, 2.5));
        } else {
          holoRig.scale.setScalar(THREE.MathUtils.clamp(grabState.initialScale * scaleMultiplier, 0.25, 1.8));
        }
      }

      // Thumbstick Locomotion & Suit Control
      for (const source of session.inputSources) {
        if (!source.gamepad) continue;
        const axes = source.gamepad.axes;
        const x = Math.abs(axes[2]) > 0.05 ? axes[2] : (Math.abs(axes[0]) > 0.05 ? axes[0] : 0);
        const y = Math.abs(axes[3]) > 0.05 ? axes[3] : (Math.abs(axes[1]) > 0.05 ? axes[1] : 0);

        // Left Stick: Seated Gliding
        if (source.handedness === 'left' && (Math.abs(x) > 0.15 || Math.abs(y) > 0.15)) {
          const forward = new THREE.Vector3();
          camera.getWorldDirection(forward);
          forward.y = 0;
          forward.normalize();
          const right = new THREE.Vector3().crossVectors(camera.up, forward).negate().normalize();

          cameraRig.position.addScaledVector(forward, -y * 2.2 * delta);
          cameraRig.position.addScaledVector(right, x * 2.2 * delta);
        }

        // Right Stick: Rotate and Scale suit
        if (source.handedness === 'right') {
          if (Math.abs(x) > 0.15) holoRig.rotation.y += x * 2.5 * delta;
          if (Math.abs(y) > 0.15) {
            const factor = THREE.MathUtils.clamp(1.0 - y * 1.0 * delta, 0.95, 1.05);
            holoRig.scale.multiplyScalar(factor).clampScalar(0.25, 1.8);
          }
        }
      }
    }

    // -------------------------------------------------------------
    // 16. MAIN ANIMATION LOOP
    // -------------------------------------------------------------
    renderer.setAnimationLoop((timestamp) => {
      const delta = clock.getDelta();
      const time = timestamp * 0.001;

      handleInput(delta);

      // Faceplate & explode actuation (segmented fallback hologram only —
      // the GLB hologram has no named faceplate/limb nodes to drive)
      if (!holoIsGLB) {
        const targetMask = isMaskOpen ? 1.0 : 0.0;
        maskProgress += (targetMask - maskProgress) * 0.12;
        holoSuit.faceplate.position.y = 0.01 + maskProgress * 0.07;
        holoSuit.faceplate.position.z = 0.08 - maskProgress * 0.02;
        holoSuit.faceplate.rotation.x = -maskProgress * (Math.PI / 4);

        const targetExplode = isExploded ? 1.0 : 0.0;
        explodeProgress += (targetExplode - explodeProgress) * 0.08;
        holoSuit.helmet.position.y = 1.62 + explodeProgress * 0.18;
        holoSuit.torso.position.z = explodeProgress * 0.08;
        holoSuit.armL.position.x = -0.25 - explodeProgress * 0.15;
        holoSuit.armR.position.x = 0.25 + explodeProgress * 0.15;
        holoSuit.legL.position.y = 0.9 - explodeProgress * 0.14;
        holoSuit.legR.position.y = 0.9 - explodeProgress * 0.14;
      }

      // Idle life: gimbal spin, gentle hover bob, light flicker
      gimbalRing1.rotation.z = time * 0.3;
      holoRig.position.y = holoBaseY + Math.sin(time * 1.2) * 0.025;
      holoLight.intensity = 2.6 + Math.sin(time * 2.2) * 0.25;

      // Holo-forge: optional spin + emitter pad pulse
      if (forgeSpin) forgeGroup.rotation.y += delta * 0.8;
      forgePad.material.opacity = 0.55 + Math.sin(time * 3) * 0.2;

      // DamagedHelmet turntable
      helmetAnchor.rotation.y = time * 0.4;

      if (renderer.xr.isPresenting) {
        renderer.render(scene, camera);
      } else {
        composer.render();
      }
    });

    // -------------------------------------------------------------
    // 17. INITIALIZATION TRIGGER & AUDIO UNLOCK
    // -------------------------------------------------------------
    document.getElementById('init-btn').addEventListener('click', async () => {
      if (audioCtx.state === 'suspended') {
        await audioCtx.resume();
      }

      initBuffers();
      initSpeechEngine();
      drawTerminalUI();

      jarvisSpeak("Welcome back, sir. Hall of Armor and command terminal are online.");
      document.getElementById('status-pill').textContent = 'J.A.R.V.I.S. online — systems nominal.';
      document.getElementById('init-overlay').style.display = 'none';
      document.body.appendChild(VRButton.createButton(renderer));
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      composer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
